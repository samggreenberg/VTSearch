<div class="view-controls">
  <div class="segmented-toggle segmented-toggle--compact">
    <button
      type="button"
      class="segmented-toggle__btn"
      [disabled]="atMinSize() || !currentMediaType()"
      (click)="bumpSize(-1)"
      title="Smaller thumbnails"
      aria-label="Smaller thumbnails">
      <vt-icon type="image" [size]="11"></vt-icon>
    </button>
    <button
      type="button"
      class="segmented-toggle__btn"
      [disabled]="atMaxSize() || !currentMediaType()"
      (click)="bumpSize(1)"
      title="Bigger thumbnails"
      aria-label="Bigger thumbnails">
      <vt-icon type="image" [size]="18"></vt-icon>
    </button>
  </div>

  @if (showFocus()) {
  <div class="segmented-toggle segmented-toggle--compact">
    <button
      type="button"
      class="segmented-toggle__btn"
      [class.segmented-toggle__btn--active]="focusMode() === 'click'"
      (click)="setFocusMode('click')"
      title="Click to preview"
      aria-label="Click focus mode"
      [attr.aria-pressed]="focusMode() === 'click'">
      <vt-icon type="cursor-click" [size]="13"></vt-icon>
    </button>
    <button
      type="button"
      class="segmented-toggle__btn"
      [class.segmented-toggle__btn--active]="focusMode() === 'hover'"
      (click)="setFocusMode('hover')"
      title="Hover to preview"
      aria-label="Hover focus mode"
      [attr.aria-pressed]="focusMode() === 'hover'">
      <vt-icon type="cursor-hover" [size]="13"></vt-icon>
    </button>
  </div>
  }
</div>
