<div class="label-layout">
  <aside class="panel-left">
    <h3>Media List</h3>
    <div class="media-list">
      @for (item of medias; track item.id) {
        <button
          class="media-list-item"
          [class.active]="item.id === selectedMedia?.id"
          (click)="selectMedia(item)"
        >
          {{ item.filename || 'Media #' + item.id }}
        </button>
      }
    </div>
  </aside>
  <main class="panel-center">
    <vt-center-panel
      [media]="selectedMedia"
      (mediaVoted)="onMediaVoted($event)"
      #centerPanelRef
    ></vt-center-panel>
  </main>
  <aside class="panel-right">
    <p class="placeholder-text">Labels panel (Phase 6)</p>
  </aside>
</div>
