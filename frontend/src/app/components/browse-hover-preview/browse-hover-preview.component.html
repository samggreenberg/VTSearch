@if (player(); as p) {
  <div
    class="hover-player"
    [style.left.px]="p.left"
    [style.top.px]="p.top"
    (mouseenter)="onPanelEnter()"
    (mouseleave)="onPanelLeave()"
  >
    <div class="hover-player-head">{{ p.count }} {{ p.count === 1 ? 'item' : 'items' }}</div>
    <img class="hover-player-wave" [src]="p.waveUrl" alt="" aria-hidden="true" />
    <audio
      #audioEl
      class="hover-player-audio"
      [src]="p.audioSrc"
      controls
      controlsList="nodownload"
    ></audio>
  </div>
}
@if (visible) {
  <div
    class="hover-popup"
    [style.left.px]="left"
    [style.top.px]="top"
  >
    <div class="hover-count">{{ count }} {{ count === 1 ? 'item' : 'items' }}</div>
    @if (textContent()) {
      <div class="hover-text">{{ textContent() }}</div>
    }
  </div>
}
