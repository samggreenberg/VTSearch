<aside class="panel-right" aria-label="Labels">
  <vt-detector-context-bar
    [visible]="!!trainMode"
    [detectorName]="trainMode?.model?.name ?? ''"
    (renamed)="onDetectorRenamed($event)"
  />

  @if (mode !== 'find') {
    <div class="import-row">
      <button class="panel-btn import-btn" [disabled]="disabled" (click)="onImportLabels()" title="Import good/bad labels from a file or add media directly to the good or bad pile">Import Labels</button>
    </div>
  }

  <div class="sort-row">
    <vt-label-sort
      [mode]="sortMode"
      (modeChange)="onSortModeChange($event)"
    />
  </div>

  <div class="view-row">
    <vt-view-controls
      side="right"
      [currentMediaType]="currentMediaType"
      class="view-controls-slot" />
  </div>

  <vt-label-list
    label="good"
    [ids]="goodIds"
    [medias]="medias"
    [clickTimes]="clickTimes"
    [learnedScores]="learnedScores"
    [sortMode]="sortMode"
    [viewMode]="viewMode"
    [gridGoalWidth]="gridGoalWidth"
    [focusMode]="focusMode"
    (mediaSelected)="onMediaSelected($event)"
    (mediaVote)="onMediaVote($event)"
  />

  <div class="label-divider"></div>

  <vt-label-list
    label="bad"
    [ids]="badIds"
    [medias]="medias"
    [clickTimes]="clickTimes"
    [learnedScores]="learnedScores"
    [sortMode]="sortMode"
    [viewMode]="viewMode"
    [gridGoalWidth]="gridGoalWidth"
    [focusMode]="focusMode"
    (mediaSelected)="onMediaSelected($event)"
    (mediaVote)="onMediaVote($event)"
  />

  <div class="export-row">
    <button class="panel-btn export-btn" [disabled]="disabled" (click)="onExport()" title="Export labeled items to clipboard, file, email, or webhook">Export</button>
  </div>
</aside>

@if (showLabelImport) {
  <vt-label-importer-modal (closed)="showLabelImport = false" (imported)="voteState.loadVotes()" />
}

@if (showExport) {
  <vt-export-modal
    [detectorName]="trainMode?.model?.name ?? ''"
    (closed)="showExport = false"
    (exported)="showExport = false"
  />
}
