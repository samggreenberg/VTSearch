<aside class="panel-right" aria-label="Labels">
  <vt-detector-context-bar
    [visible]="!!trainMode"
    [detectorName]="trainMode?.model?.name ?? ''"
    (renamed)="onDetectorRenamed($event)"
  />

  <div class="sort-row">
    <vt-label-sort
      [mode]="sortMode"
      (modeChange)="onSortModeChange($event)"
    />
    <button class="panel-btn import-btn" (click)="onImportLabels()">Import Labels</button>
  </div>

  <vt-label-list
    label="good"
    [ids]="goodIds"
    [medias]="medias"
    [clickTimes]="clickTimes"
    [learnedScores]="learnedScores"
    [sortMode]="sortMode"
    [viewMode]="viewMode"
    [gridColumns]="gridColumns"
    [focusMode]="focusMode"
    (mediaSelected)="onMediaSelected($event)"
    (mediaVote)="onMediaVote($event)"
  />

  <vt-label-list
    label="bad"
    [ids]="badIds"
    [medias]="medias"
    [clickTimes]="clickTimes"
    [learnedScores]="learnedScores"
    [sortMode]="sortMode"
    [viewMode]="viewMode"
    [gridColumns]="gridColumns"
    [focusMode]="focusMode"
    (mediaSelected)="onMediaSelected($event)"
    (mediaVote)="onMediaVote($event)"
  />

  <div class="export-row">
    <button class="panel-btn export-btn" (click)="onExport()">Export</button>
  </div>
</aside>

@if (showLabelImport) {
  <vt-label-importer-modal (closed)="showLabelImport = false" (imported)="showLabelImport = false" />
}

@if (showExport) {
  <vt-export-modal
    [detectorName]="trainMode?.model?.name ?? ''"
    (closed)="showExport = false"
    (exported)="showExport = false"
  />
}
