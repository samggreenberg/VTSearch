<aside class="panel-right" aria-label="Labels">
  <vt-detector-context-bar
    [visible]="!!trainMode"
    [detectorName]="trainMode?.model?.name ?? ''"
    (renamed)="onDetectorRenamed($event)"
  />

  <div class="sort-row">
    <vt-label-sort
      [mode]="sortMode"
      (modeChange)="onSortModeChange($event)"
    />
    <button class="panel-btn import-btn" (click)="onImportLabels()">Import Labels</button>
  </div>

  <vt-label-list
    label="good"
    [ids]="goodIds"
    [medias]="medias"
    [clickTimes]="clickTimes"
    [learnedScores]="learnedScores"
    [sortMode]="sortMode"
    [showThumbnails]="showThumbnails"
    (mediaSelected)="onMediaSelected($event)"
  />

  <vt-label-list
    label="bad"
    [ids]="badIds"
    [medias]="medias"
    [clickTimes]="clickTimes"
    [learnedScores]="learnedScores"
    [sortMode]="sortMode"
    [showThumbnails]="showThumbnails"
    (mediaSelected)="onMediaSelected($event)"
  />

  <div class="export-row">
    <button class="panel-btn export-btn" (click)="onExportLabels()">Export Labels</button>
    <button class="panel-btn export-btn" (click)="onExportDetector()">Export Detector</button>
  </div>
</aside>

@if (showDetectorExport) {
  <vt-detector-export-modal (closed)="showDetectorExport = false" (exported)="showDetectorExport = false" />
}
