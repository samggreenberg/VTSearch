@if (open()) {
<!--
  A modal <dialog>, opened with showModal() as soon as it renders (#5297). The
  platform then manages focus for every dialog in the app: focus moves to the
  first focusable control (or, with initialFocus 'dialog', to the box, which
  carries `autofocus`); the rest of the page is inert, so neither Tab nor a
  click nor a screen reader reaches it; and the dialog draws in the top layer,
  over every z-index, stacked in the order the dialogs opened. The element is
  itself the full-window backdrop, so a click outside the box lands on it.

  closedby="none": Escape is ours, not the browser's. `(closed)` is a request
  to the parent, which owns `[open]`; a natively closed element would disagree
  with it. The (cancel) and (close) bindings are the backstop for browsers
  without `closedby`.
-->
<dialog
  #dialog
  class="modal-backdrop"
  closedby="none"
  [attr.aria-label]="title()"
  (click)="onBackdropClick($event)"
  (cancel)="$event.preventDefault()"
  (close)="onNativeClose()"
>
  <div
    #box
    class="modal-content"
    [attr.tabindex]="initialFocus() === 'dialog' ? -1 : null"
    [attr.autofocus]="initialFocus() === 'dialog' ? '' : null"
  >
    <div class="modal-header">
      <h2>{{ title() }}</h2>
      @if (showCloseButton()) {
        <button class="modal-close" (click)="close()" title="Close" aria-label="Close">&times;</button>
      }
    </div>
    <div class="modal-body">
      <ng-content />
    </div>
    <div class="modal-footer">
      <!-- Left end of the footer row: a secondary affordance that belongs on
           the action line rather than on a half-empty line of its own (the
           "Advanced ▾" disclosure, #4305). The actions stay right-aligned. -->
      <ng-content select="[modal-footer-start]" />
      <ng-content select="[modal-footer]" />
    </div>
  </div>
</dialog>
}
