@if (open()) {
<!--
  cdkTrapFocus + auto-capture gives the dialog full keyboard/screen-reader focus
  management app-wide: on open it saves the triggering element and moves focus to
  the first tabbable control inside the dialog; Tab/Shift+Tab then cycle within
  the dialog instead of escaping to the page behind it; and on close (the `@if`
  destroys this subtree) focus is restored to the trigger. With initialFocus
  'dialog', the box itself is the initial element (cdkFocusInitial) instead.
-->
<div
  class="modal-backdrop"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()"
  tabindex="-1"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
>
  <div
    #box
    class="modal-content"
    [attr.tabindex]="initialFocus() === 'dialog' ? -1 : null"
    [attr.cdkFocusInitial]="initialFocus() === 'dialog' ? '' : null"
  >
    <div class="modal-header">
      <h2>{{ title() }}</h2>
      @if (showCloseButton()) {
        <button class="modal-close" (click)="close()" title="Close" aria-label="Close">&times;</button>
      }
    </div>
    <div class="modal-body">
      <ng-content />
    </div>
    <div class="modal-footer">
      <!-- Left end of the footer row: a secondary affordance that belongs on
           the action line rather than on a half-empty line of its own (the
           "Advanced ▾" disclosure, #4305). The actions stay right-aligned. -->
      <ng-content select="[modal-footer-start]" />
      <ng-content select="[modal-footer]" />
    </div>
  </div>
</div>
}
