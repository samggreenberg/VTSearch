<div
  #imageWrap
  class="image-wrap"
  [style.cursor]="wrapCursor"
  (wheel)="onWheel($event)"
  (mousedown)="onMouseDown($event)"
>
  <img
    #imageEl
    [src]="imageSrc"
    [alt]="media.filename || 'Image media'"
    class="image-element"
    [class.image-loading]="!imageReady"
    [style.transform]="imageTransform"
    (load)="onImageLoad()"
    (error)="onImageError()"
    draggable="false"
    fetchpriority="high"
  />
</div>
