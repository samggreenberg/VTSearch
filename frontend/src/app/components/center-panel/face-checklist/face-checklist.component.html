<aside class="face-checklist" aria-labelledby="face-checklist-heading">
  <header class="checklist-header">
    <h4 id="face-checklist-heading">What to compare</h4>
    <p class="checklist-order">Most telling first</p>
  </header>
  <ol class="checklist-rows">
    @for (row of rows(); track row.check.part) {
      <li class="checklist-row">
        <ng-template #words>
          <span class="checklist-part">{{ row.check.part }}</span>
          <span class="checklist-look">{{ row.check.look }}</span>
        </ng-template>
        @if (row.views) {
          <button
            type="button"
            class="checklist-zoom"
            data-metric="faceChecklistZoom"
            [class.active]="partInView() === row.check.part"
            [attr.aria-pressed]="partInView() === row.check.part"
            [disabled]="!row.views.length"
            [title]="row.title"
            (click)="zoomTo(row)"
          ><ng-container [ngTemplateOutlet]="words" /></button>
        } @else {
          <ng-container [ngTemplateOutlet]="words" />
        }
      </li>
    }
  </ol>
  <p class="checklist-ignore">Don't weigh hair, beard, makeup or skin tone.</p>
  @if (fitness(); as notice) {
    <p class="checklist-fitness" role="note">{{ notice }}</p>
  }
</aside>
