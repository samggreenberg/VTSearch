<div class="vote-buttons" #voteButtons>
  <button
    class="btn-bad"
    [disabled]="unavailable()"
    [class.voted]="isBad()"
    [class.vote-flash]="badFlash()"
    (click)="onVoteBad($event)"
    title="Mark this media as a Bad example."
  >
    <vt-icon type="thumbs-down" [size]="18" [class.icon-spinning]="spinningVote() === 'bad'"></vt-icon>
    Bad
  </button>
  <button
    class="btn-good"
    [disabled]="unavailable()"
    [class.voted]="isGood()"
    [class.vote-flash]="goodFlash()"
    (click)="onVoteGood($event)"
    title="Mark this media as a Good example."
  >
    <vt-icon type="thumbs-up" [size]="18" [class.icon-spinning]="spinningVote() === 'good'"></vt-icon>
    Good
  </button>
</div>
@if (showHint()) {
  <vt-toasty-hint hintId="start-voting" [anchor]="voteButtons" side="above" reach="right">
    Click <strong>Bad</strong> / <strong>Good</strong> (or &larr; / &rarr;) to vote whether this is
    what you're looking for. Autopilot picks what to ask next. Your detector learns from every
    answer.
  </vt-toasty-hint>
}
