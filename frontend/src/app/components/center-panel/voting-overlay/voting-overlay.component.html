<div class="vote-buttons">
  <button
    class="btn-bad"
    [class.voted]="isBad"
    [class.vote-flash]="badFlash"
    [disabled]="disabled"
    (click)="onVoteBad()"
    title="Mark this media as a Bad example."
    data-label="Bad"
  >
    Bad
  </button>
  <button
    class="btn-good"
    [class.voted]="isGood"
    [class.vote-flash]="goodFlash"
    [disabled]="disabled"
    (click)="onVoteGood()"
    title="Mark this media as a Good example."
    data-label="Good"
  >
    Good
  </button>
</div>
