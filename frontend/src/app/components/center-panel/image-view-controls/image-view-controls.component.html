@if (marquee()) {
  <button
    class="btn btn--toolbar ivc-btn ivc-btn-toggle"
    [class.active]="viewer().marqueeMode()"
    (click)="viewer().toggleMarqueeMode()"
    [title]="marqueeTitle()"
    [attr.aria-label]="marqueeAriaLabel()"
    [attr.aria-pressed]="viewer().marqueeMode()"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2.5" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="0.5"/></svg>
  </button>
}
@if (highlight()) {
  <button
    class="btn btn--toolbar ivc-btn ivc-btn-toggle"
    [class.active]="viewer().highlightMode()"
    (click)="viewer().toggleHighlightMode()"
    title="Highlight: outline the region the detector matched best"
    aria-label="Highlight: outline best-matched region"
    [attr.aria-pressed]="viewer().highlightMode()"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-8 8-6-6z"/><path d="M6 12l-2.5 6.5L10 16z" fill="currentColor"/></svg>
  </button>
}
@if (marquee() || highlight()) {
  <span class="ivc-sep" aria-hidden="true"></span>
}
<button class="btn btn--toolbar ivc-btn" (click)="viewer().rotateLeft()" title="Rotate left ([)" aria-label="Rotate image left"><vt-icon type="rotate-ccw" [size]="16"></vt-icon></button>
<button class="btn btn--toolbar ivc-btn" (click)="viewer().rotateRight()" title="Rotate right (])" aria-label="Rotate image right"><vt-icon type="rotate-cw" [size]="16"></vt-icon></button>
<button class="btn btn--toolbar ivc-btn" (click)="viewer().zoomOut()" title="Zoom out (-)" aria-label="Zoom out"><vt-icon type="zoom-out" [size]="16"></vt-icon></button>
<button class="btn btn--toolbar ivc-btn" (click)="viewer().zoomIn()" title="Zoom in (+, or double-click the image)" aria-label="Zoom in"><vt-icon type="zoom-in" [size]="16"></vt-icon></button>
<label [for]="zoomSliderId" class="sr-only">Zoom</label>
<input
  type="range"
  [id]="zoomSliderId"
  class="ivc-zoom-slider"
  [min]="viewer().minZoom"
  [max]="viewer().maxZoom"
  [step]="viewer().zoomStep"
  [value]="viewer().zoom()"
  (input)="viewer().onZoomInput($event)"
  title="Zoom"
  aria-label="Zoom level"
/>
<span class="ivc-zoom-label">{{ viewer().zoomLabel() }}</span>
<button class="btn btn--toolbar ivc-btn" (click)="viewer().resetView()" title="Reset view" aria-label="Reset image view"><vt-icon type="zoom-fit" [size]="16"></vt-icon></button>
