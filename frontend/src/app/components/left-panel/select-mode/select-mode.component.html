<div class="select-mode-group">
  <span class="sort-label" title="Choose which unlabeled item to present next for labeling.">Select:</span>
  <label class="sort-radio" [class.active]="selectMode === 'top'" title="Pick the highest-ranked unlabeled item. Best for quickly finding strong matches.">
    <input
      type="radio"
      name="selectMode"
      value="top"
      [checked]="selectMode === 'top'"
      (change)="onChange('top')"
    />
    Top
  </label>
  <label class="sort-radio" [class.active]="selectMode === 'hard'" title="Pick the item closest to the decision boundary. These uncertain cases improve detector accuracy fastest.">
    <input
      type="radio"
      name="selectMode"
      value="hard"
      [checked]="selectMode === 'hard'"
      (change)="onChange('hard')"
    />
    Hard
  </label>
  <label class="sort-radio" [class.active]="selectMode === 'new'" title="Pick an item from an underexplored region of the dataset using diversity sampling. Ensures broad coverage.">
    <input
      type="radio"
      name="selectMode"
      value="new"
      [checked]="selectMode === 'new'"
      (change)="onChange('new')"
    />
    New
  </label>
</div>
