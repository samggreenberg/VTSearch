<div
  class="media-item"
  [class.active]="active"
  [class.labeled-good]="voteLabel === 'good'"
  [class.labeled-bad]="voteLabel === 'bad'"
  [class.grid-mode]="isGrid"
  role="option"
  [attr.aria-selected]="active"
  tabindex="0"
  (click)="onClick()"
  (contextmenu)="onContextMenu($event)"
  (mouseenter)="onMouseEnter()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
>
  @if (isGrid) {
    @if (thumbnailUrl) {
      <img class="media-thumbnail" [src]="thumbnailUrl" [alt]="displayName" loading="lazy" (error)="onThumbnailError()" />
    } @else if (placeholderIcon) {
      <span class="media-placeholder">{{ placeholderIcon }}</span>
    }
    <span class="media-name-grid">{{ displayName }}</span>
  } @else {
    <span class="label-indicator" [class.good]="voteLabel === 'good'" [class.bad]="voteLabel === 'bad'" [title]="voteLabel === 'good' ? 'Labeled good' : voteLabel === 'bad' ? 'Labeled bad' : ''">
      @if (voteLabel === 'good') { &#x2713; } @else if (voteLabel === 'bad') { &#x2717; }
    </span>
    @if (thumbnailUrl) {
      <img class="media-thumbnail" [src]="thumbnailUrl" [alt]="displayName" loading="lazy" (error)="onThumbnailError()" />
    }
    <span class="media-name">{{ displayName }}</span>
  }
  @if (score !== null) {
    <span class="media-score" title="Model confidence score">{{ score | number:'1.2-2' }}</span>
  }
</div>
