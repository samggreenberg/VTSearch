<div class="progress-check-bar">
  @if (sortBusy) {
    <div class="sort-overlay" aria-live="polite">
      <!-- Status (left) + ETA (right) share one reserved-height line above the
           bar so the bar keeps a fixed position as the text changes. -->
      <div class="sort-overlay-meta">
        <span class="sort-overlay-status">{{ sortStatus }}</span>
        <span class="sort-overlay-status sort-overlay-eta">{{ sortEta }}</span>
      </div>
      <div class="sort-overlay-bar">
        <vt-progress-bar
          [indeterminate]="sortBar.indeterminate"
          [value]="sortBar.value"
          [max]="sortBar.max"
        />
        <button
          class="btn btn--cancel btn--sm"
          (click)="onCancel()"
          title="Cancel the running sort"
        >Cancel</button>
      </div>
    </div>
  } @else {
    <button
      class="labeling-indicator"
      [attr.data-status]="smartStatus"
      (click)="onClick('smart')"
      aria-label="Smart indicator"
      [title]="smartTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Smart</span>
    </button>

    <button
      class="labeling-indicator"
      [attr.data-status]="stableStatus"
      (click)="onClick('stable')"
      aria-label="Stable indicator"
      [title]="stableTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Stable</span>
    </button>

    <button
      class="labeling-indicator"
      [attr.data-status]="spanStatus"
      (click)="onClick('span')"
      aria-label="Diverse indicator"
      [title]="spanTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Diverse</span>
    </button>
  }
</div>
