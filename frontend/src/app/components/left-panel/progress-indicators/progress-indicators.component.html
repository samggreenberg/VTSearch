<div class="progress-check-bar">
  @if (sortBusy()) {
    <div class="sort-overlay" aria-live="polite">
      <vt-job-progress
        [header]="sortStatus()"
        [eta]="sortEta"
        [bar]="sortBar"
        cancelTitle="Cancel the running sort"
        (cancel)="onCancel()"
      />
    </div>
  } @else if (dryRunStop) {
    <!-- A document dataset stops on the dry run, not the three lights (#4488). -->
    <div
      class="labeling-indicator dry-run-indicator"
      role="status"
      [attr.data-status]="dryRunStatus"
      aria-label="Dry run indicator"
      [title]="dryRunTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Dry run {{ dryRunCount }}/{{ dryRunTarget }}</span>
    </div>
  } @else {
    <button
      class="labeling-indicator"
      [attr.data-status]="smartStatus"
      (click)="onClick('smart')"
      aria-label="Smart indicator"
      [title]="smartTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Smart</span>
    </button>

    <button
      class="labeling-indicator"
      [attr.data-status]="stableStatus"
      (click)="onClick('stable')"
      aria-label="Stable indicator"
      [title]="stableTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Stable</span>
    </button>

    <button
      class="labeling-indicator"
      [attr.data-status]="spanStatus"
      (click)="onClick('span')"
      aria-label="Diverse indicator"
      [title]="spanTooltip"
    >
      <span class="indicator-dot"></span>
      <span class="indicator-label">Diverse</span>
    </button>
  }
</div>
