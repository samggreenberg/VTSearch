<div class="inclusion-selector">
  <label class="inclusion-label" for="inclusion-input" title="Adjust how many items to include. Each step up roughly halves the share of real matches the cutoff may miss, and only ever adds items - everything included at a lower setting stays included. Lower values keep only the surest matches.">
    Inclusion
  </label>
  <input
    id="inclusion-input"
    type="number"
    min="-10"
    max="10"
    step="1"
    [value]="value()"
    (input)="onInput($event)"
    title="Higher includes more items (each step up halves the share of real matches the cutoff may miss); lower includes fewer (only the surest matches)."
    aria-label="Inclusion"
  />
</div>
