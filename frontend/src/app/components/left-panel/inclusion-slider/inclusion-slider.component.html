<div class="inclusion-selector">
  <label class="inclusion-label" for="inclusion-input" title="Adjust how many items to include. Each step up only ever adds items - everything included at a lower setting stays included - though how many a step adds depends on the detector. Lower values keep only the surest matches.">
    Inclusion
  </label>
  <input
    id="inclusion-input"
    type="number"
    min="-10"
    max="10"
    step="1"
    [value]="value()"
    (input)="onInput($event)"
    title="Higher includes more items; lower includes fewer (only the surest matches)."
    aria-label="Inclusion"
  />
</div>
