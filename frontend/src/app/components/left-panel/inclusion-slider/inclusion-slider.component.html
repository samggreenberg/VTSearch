<div class="inclusion-selector">
  <label class="inclusion-label" for="inclusion-input" title="Adjust how many items to include. Higher values include more items to catch everything, at the risk of some wrong matches. Lower values include fewer, keeping only the surest matches. Retrains the learned sort.">
    Inclusion
  </label>
  <input
    id="inclusion-input"
    type="number"
    min="-10"
    max="10"
    step="1"
    [value]="value()"
    (input)="onInput($event)"
    title="Higher includes more items (catch everything, some may be wrong); lower includes fewer (only the surest matches)."
    aria-label="Inclusion"
  />
</div>
