@if (visible) {
  <div class="stripe-overview" role="img" aria-label="Media minimap" title="Minimap of all items in sort order. Green = good votes, red = bad votes, white = selected. Click to jump." (click)="onStripeClick($event)" tabindex="0" (keydown.enter)="onStripeClick($event)" (keydown.space)="onStripeClick($event)">
    <div class="stripe-container">
      @for (dot of cachedDots; track $index) {
        <div
          class="stripe-dot"
          [class.good]="dot.type === 'good'"
          [class.bad]="dot.type === 'bad'"
          [class.selected]="dot.type === 'selected'"
          [style.top.%]="dot.top"
        ></div>
      }

      @if (cachedThresholdPosition !== null) {
        <div
          class="stripe-threshold"
          [style.top.%]="cachedThresholdPosition"
        ></div>
      }
    </div>
  </div>
}
