<div class="precision-floor">
  <div class="floor-picker">
    <!-- "Lean: [Centered]" reads as one phrase, so it sits tighter than the
         controls projected after it. -->
    <span class="floor-phrase">
      <label class="floor-label" for="precision-floor-select" title="Toward returning everything, or only what is right">
        Lean:
      </label>
      <select
        id="precision-floor-select"
        class="form-select form-select--compact"
        aria-label="Precision floor"
        title="Complete returns the most, Correct the fewest wrong ones, Centered sits between them"
        (change)="onChange($event)"
      >
        @for (opt of options; track opt.value) {
          <option [value]="opt.value" [selected]="opt.value === selected()">{{ opt.label }}</option>
        }
      </select>
      @if (!summary()) {
        <vt-field-hint-icon [hint]="hint" ariaLabel="What the precision floor means" placement="below-block" />
      }
    </span>
    <!-- Controls that belong on the picker's line (Find's work-queue actions). -->
    <ng-content select="[floorActions]" />
  </div>
  @if (summary(); as text) {
    <p class="floor-state" [attr.data-status]="dot()">
      <span class="indicator-dot" aria-hidden="true"></span>
      <span class="floor-state-text" role="status" [title]="explanation() ?? ''">{{ text }}</span>
      <vt-field-hint-icon [hint]="hint" ariaLabel="What the precision floor means" placement="below-block" />
    </p>
  }
</div>
