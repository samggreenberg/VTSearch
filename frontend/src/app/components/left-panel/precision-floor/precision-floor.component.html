<div class="precision-floor">
  <div class="floor-picker">
    <label class="floor-label" for="precision-floor-select" title="The share of what the detector returns that should be right">
      At least
    </label>
    <select
      id="precision-floor-select"
      class="form-select form-select--compact"
      aria-label="Precision floor"
      title="How much of what the detector returns should be right"
      (change)="onChange($event)"
    >
      @if (value() === null) {
        <option [value]="noFloor" disabled selected>No floor</option>
      }
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value" [selected]="opt.value === selected()">{{ opt.label }}</option>
      }
    </select>
    <span class="floor-label">right</span>
    <vt-field-hint-icon [hint]="hint" ariaLabel="What the precision floor means" />
  </div>
  @if (summary(); as text) {
    <p class="floor-state" role="status" [attr.data-status]="dot()" [title]="explanation() ?? ''">
      <span class="indicator-dot" aria-hidden="true"></span>
      <span class="floor-state-text">{{ text }}</span>
    </p>
  }
</div>
