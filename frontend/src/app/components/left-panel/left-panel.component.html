<div class="left-panel" [class.collapsed-autopilot]="activeTab === 'autopilot' && autopilotCollapsed">
  @if (!(activeTab === 'autopilot' && autopilotCollapsed)) {
    <div class="left-tabs" role="tablist" aria-label="Panel mode">
      <button
        class="left-tab"
        role="tab"
        [class.active]="activeTab === 'manual'"
        [attr.aria-selected]="activeTab === 'manual'"
        (click)="setTab('manual')"
      >Manual</button>
      <button
        class="left-tab"
        role="tab"
        [class.active]="activeTab === 'autopilot'"
        [attr.aria-selected]="activeTab === 'autopilot'"
        (click)="setTab('autopilot')"
        title="Autopilot guides you through labeling in phases: good examples, bad examples, boundary refinement, and diversity exploration."
      ><span class="label-full">Autopilot</span><span class="label-short">Auto</span></button>
    </div>
  }

  @if (activeTab === 'manual') {
    <div class="tab-panel-manual" role="tabpanel" aria-label="Manual mode">
      <vt-sort-bar
        [sortMode]="sortMode"
        [loadSortLabel]="loadSortLabel"
        [initialTextQuery]="textQuery"
        [hasGoodVotes]="goodVotes.size > 0"
        [hasBadVotes]="badVotes.size > 0"
        (sortModeChange)="sortModeChange.emit($event)"
        (textSort)="textSort.emit($event)"
        (learnedSort)="learnedSort.emit()"
        (loadSort)="loadSort.emit()"
        (detectorLoaded)="detectorLoaded.emit($event)"
        (exampleSortStarted)="exampleSortStarted.emit($event)"
      />

      <vt-select-mode
        [selectMode]="selectMode"
        (selectModeChange)="selectModeChange.emit($event)"
      />

      <vt-progress-indicators
        [labelingStatus]="labelingStatus"
        [sortBusy]="sortBusy"
        [sortStatus]="sortStatus"
        (indicatorClick)="indicatorClick.emit($event)"
      />

      <vt-inclusion-slider
        [value]="inclusion"
        (valueChange)="inclusionChange.emit($event)"
        (viewClicked)="showLeftViewSettings = true"
      />

      <div class="media-list-container">
        <vt-media-list
          [medias]="medias"
          [sortOrder]="sortOrder"
          [threshold]="threshold"
          [selectedId]="selectedId"
          [goodVotes]="goodVotes"
          [badVotes]="badVotes"
          [viewMode]="viewMode"
          [gridColumns]="gridColumns"
          [focusMode]="focusMode"
          [showScores]="false"
          (mediaSelect)="mediaSelect.emit($event)"
          (mediaVote)="mediaVote.emit($event)"
        />
        <vt-stripe-overview
          [sortOrder]="sortOrder"
          [threshold]="threshold"
          [selectedId]="selectedId"
          [goodVotes]="goodVotes"
          [badVotes]="badVotes"
          [totalCount]="medias.length"
          (stripeClick)="onStripeClick($event)"
        />
      </div>
    </div>
  } @else {
    <div class="tab-panel-autopilot" [class.collapsed]="autopilotCollapsed" role="tabpanel" aria-label="Autopilot mode">
      <vt-autopilot-panel
        [goodVotes]="goodVotes"
        [badVotes]="badVotes"
        [labelingStatus]="labelingStatus"
        [collapsed]="autopilotCollapsed"
        (started)="autopilotStart.emit()"
        (stopped)="autopilotStop.emit()"
        (toggleCollapse)="autopilotToggleCollapse.emit()"
      />
    </div>
  }
</div>

@if (showLeftViewSettings) {
  <vt-left-view-settings-modal [currentMediaType]="medias.length > 0 ? medias[0].type : ''" (closed)="showLeftViewSettings = false" />
}
