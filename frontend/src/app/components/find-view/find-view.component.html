<div class="layout" #layout>
  <div class="panel-left">
    <vt-left-panel
      [medias]="mediaState.mediasSignal()"
      [sortOrder]="unverifiedSortOrder()"
      [threshold]="sortState.threshold"
      [selectedId]="mediaState.selectedId()"
      [goodVotes]="noVotes"
      [badVotes]="noVotes"
      [sortMode]="sortState.sortMode"
      [selectMode]="sortState.selectMode"
      [inclusion]="sortState.inclusion"
      [sortBusy]="sortState.sortBusy"
      [sortStatus]="sortState.sortStatus"
      [sortProgress]="sortState.sortProgress"
      [sortProgressTotal]="sortState.sortProgressTotal"
      [sortOverall]="sortState.sortOverall"
      [sortEtaSeconds]="sortState.sortEtaSeconds"
      [labelingStatus]="null"
      [gridGoalWidth]="gridGoalWidthLeft()"
      [focusMode]="focusModeLeft()"
      [loadSortLabel]="sortState.loadSortLabel"
      [textQuery]="sortState.textQuery"
      [datasetName]="datasetName()"
      [panelMode]="'find'"
      [disabled]="sortState.sortBusy"
      [autopilotCollapsed]="false"
      [autopilotEnabled]="false"
      (mediaSelect)="onMediaSelect($event)"
      (mediaVote)="onHoverVote($event)"
      (inclusionChange)="onInclusionChange($event)"
      (browse)="onBrowseUnverified()"
      (toDataset)="onToDatasetUnverified()"
      (unverifiedExport)="onExportRequest('unverified_good')"
      (sortCancel)="onSortCancel()"
    />
  </div>
  <div
    class="divider-left"
    (mousedown)="onDividerMouseDown($event)"
  ></div>
  <div class="panel-center">
    @if (sortState.sortBusy) {
      <div class="find-wait-overlay" role="status" aria-live="polite">
        <div class="find-wait-content">
          <p class="find-wait-message">Please wait: scoring dataset with detector…</p>
          <vt-progress-bar
            [indeterminate]="sortBar.indeterminate"
            [value]="sortBar.value"
            [max]="sortBar.max"
          />
          <!-- Reserved-height line so the count/ETA appearing or disappearing
               doesn't re-center the column and shift the bar above it. -->
          <span class="find-wait-count">
            @if (sortState.sortProgressTotal > 0) {
              {{ sortState.sortProgress | number }} / {{ sortState.sortProgressTotal | number }}
            }
            @if (sortEta) {
              <span class="find-wait-eta">{{ sortEta }}</span>
            }
          </span>
          <button class="btn btn--secondary btn--sm" (click)="onSortCancel()">Cancel</button>
        </div>
      </div>
    }
    <vt-center-panel
      [media]="mediaState.selectedMedia"
      [disabled]="sortState.sortBusy"
      (mediaVoted)="onMediaVoted($event)"
    />
  </div>
  <div
    class="divider-right"
    (mousedown)="onRightDividerMouseDown($event)"
  ></div>
  <div class="panel-right">
    <vt-right-panel
      [medias]="mediaState.mediasSignal()"
      [focusMode]="focusModeRight()"
      [disabled]="sortState.sortBusy"
      mode="find"
      (mediaSelected)="onMediaSelect($event)"
      (mediaVoted)="onHoverVote($event)"
      (browse)="onBrowse()"
      (toDataset)="onToDataset()"
      (exportLabels)="onExportRequest($event)"
      (stats)="onStats()"
      (addCorrections)="onAddCorrections()"
    />
  </div>
</div>

@if (showExport) {
  <vt-export-modal
    [initialFilter]="exportFilter"
    (closed)="showExport = false"
    (exported)="showExport = false"
  />
}

@if (showStats) {
  <vt-find-stats-modal (closed)="showStats = false" />
}
