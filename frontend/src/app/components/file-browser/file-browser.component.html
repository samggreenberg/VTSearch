<div class="file-browser-field">
  <div class="browse-row">
    <input
      type="text"
      class="form-input"
      [(ngModel)]="inputValue"
      (ngModelChange)="onInputChange()"
      [placeholder]="placeholder()"
      aria-label="File path"
    />
    <button
      type="button"
      class="btn btn--secondary"
      (click)="browserOpen ? closeBrowser() : openBrowser()"
      title="Browse server files"
    >Browse</button>
  </div>

  @if (browserOpen) {
    <div class="browse-panel">
      <vt-folder-browser
        [browse]="browseFn"
        [showFiles]="true"
        (confirm)="onFileConfirmed($event)"
      ></vt-folder-browser>
    </div>
  }
</div>
