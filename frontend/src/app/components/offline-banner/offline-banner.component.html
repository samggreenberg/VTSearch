@if (connection.status() === 'offline') {
  <div class="offline-banner" role="alert" aria-live="assertive">
    <svg
      class="offline-banner__icon"
      viewBox="0 0 16 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path d="M1 1l14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      <path
        d="M3.2 6.4a8 8 0 019.6 0M5.4 9a4.8 4.8 0 015.2 0"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        fill="none"
      />
      <circle cx="8" cy="12" r="0.9" fill="currentColor" />
    </svg>
    <span class="offline-banner__text">
      <strong>Can't reach the server.</strong>
      Background updates are paused.
    </span>
    <button
      #retryBtn
      type="button"
      class="offline-banner__retry"
      (click)="connection.retry()"
      [disabled]="connection.retrying()"
    >
      {{ connection.retrying() ? 'Retrying…' : 'Retry' }}
    </button>
    <!-- Toasty over Retry (#5149). Every other hint steps aside while this
         banner is up (HintsService), and nothing a Hide box ticks could be
         saved until the server is back, so it has none. -->
    <vt-toasty-hint hintId="offline" [anchor]="retryBtn" side="above" face="sad" aboveDialogs [hideable]="false">
      The server isn't answering. Check it's still running, then click <strong>Retry</strong>.
    </vt-toasty-hint>
  </div>
}
