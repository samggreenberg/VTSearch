@if (showMultiToggle()) {
  <div class="form-group">
    <label
      class="form-label multi-toggle-label"
      [for]="multiToggleId"
      title="Make several datasets from this one import: one per kind of media you tick (Image, Audio, Document pages, Faces…), each with its own settings."
    >
      <input
        [id]="multiToggleId"
        type="checkbox"
        class="multi-toggle"
        [checked]="multiDataset()"
        (change)="onMultiToggle($any($event.target).checked)"
      />
      Multi-Dataset
      <vt-field-hint-icon hint="One import, several datasets. The source is read once; each kind of media you tick below becomes its own dataset, named after the import and the kind (for example “holiday – Image” and “holiday – Document”)."></vt-field-hint-icon>
    </label>
  </div>
}
@if (!multiDataset()) {
<div class="form-group">
  <label
    class="form-label"
    [for]="mediaTypeFieldId()"
    title="The native media type of the dataset. Other types listed below can be pulled in and converted to this type."
  >Dataset media type</label>
  <div class="media-type-dropdown" [class.open]="open">
    <button
      type="button"
      [id]="mediaTypeFieldId()"
      class="form-select media-type-trigger"
      role="combobox"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-expanded]="open"
      [attr.aria-controls]="listboxId"
      [attr.aria-activedescendant]="activeDescendantId"
      (click)="toggle()"
      (keydown)="onTriggerKeydown($event)"
    >
      <span class="media-type-trigger-content">
        @if (iconFor(mediaType())) {
          <vt-icon [icon]="iconFor(mediaType())" [size]="16"></vt-icon>
        }
        <span class="media-type-trigger-label">{{ optionLabel(mediaType()) }}</span>
      </span>
      <span class="media-type-chevron" aria-hidden="true">▾</span>
    </button>
    @if (open) {
      <ul
        class="media-type-options"
        role="listbox"
        [id]="listboxId"
        aria-label="Dataset media type"
      >
        @for (opt of mediaTypeOptions(); track opt; let i = $index) {
          <li
            class="media-type-option"
            role="option"
            [id]="optionId(i)"
            [class.selected]="opt === mediaType()"
            [class.active]="i === activeIndex"
            [attr.aria-selected]="opt === mediaType()"
            (click)="select(opt)"
            (mouseenter)="activeIndex = i"
          >
            @if (iconFor(opt)) {
              <vt-icon [icon]="iconFor(opt)" [size]="16"></vt-icon>
            }
            <span class="media-type-option-label">{{ optionLabel(opt) }}</span>
          </li>
        }
      </ul>
    }
  </div>
  @if (detectionHint()) {
    <p class="detection-hint">{{ detectionHint() }}</p>
  }
</div>
}
