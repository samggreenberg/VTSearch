<vt-modal
  [open]="true"
  [title]="view === 'cropping' ? 'Crop Example' : 'Use This Example?'"
  (closed)="onCancel()">
  @if (view === 'confirm') {
    <div class="preview">
      @switch (mediaType()) {
        @case ('image') {
          <img [src]="fileUrl" alt="Example preview" />
        }
        @case ('audio') {
          <audio [src]="fileUrl" controls></audio>
        }
        @case ('video') {
          <video [src]="fileUrl" controls></video>
        }
        @default {
          <div class="generic-preview">
            {{ file().name }}
          </div>
        }
      }
    </div>
    <div class="filename">{{ file().name }}</div>
  }

  @if (view === 'cropping') {
    @if (mediaType() === 'image') {
      <vt-image-crop-overlay
        [imageUrl]="fileUrl"
        (applied)="onImageCropApplied($event)"
        (cancelled)="onCropOverlayCancelled()">
      </vt-image-crop-overlay>
    }
    @if (mediaType() === 'audio') {
      <vt-audio-crop-overlay
        [audioUrl]="fileUrl"
        [audioFile]="file()"
        (applied)="onAudioCropApplied($event)"
        (cancelled)="onCropOverlayCancelled()">
      </vt-audio-crop-overlay>
    }
  }

  @if (view === 'confirm') {
    <div modal-footer>
      <button type="button" class="btn btn--secondary" (click)="onCancel()">Cancel</button>
      <button
        type="button"
        class="btn btn--secondary"
        [disabled]="!cropSupported"
        [title]="cropSupported ? 'Crop to a sub-region' : 'Cropping not supported for this media type'"
        (click)="onOkButCrop()">
        OK but Crop
      </button>
      <button type="button" class="btn btn--primary" (click)="onOk()">OK</button>
    </div>
  }
</vt-modal>
