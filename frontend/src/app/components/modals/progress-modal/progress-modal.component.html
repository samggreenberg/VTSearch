<vt-modal [title]="title" [open]="true" (closed)="onCancel()">
  <vt-toasty-hint hintId="progress-chart">
    This chart replays this indicator over your label history, one point for every detector
    trained along the way, so you can see when it settled.
  </vt-toasty-hint>
  @if (analyzing()) {
    <div class="analysis-loading">
      @if (!runningJob()) {
        <p aria-live="polite">Loading indicator history…</p>
      } @else {
        <vt-job-progress
          aria-live="polite"
          header="Training detectors over label history"
          [eta]="analysisProgress() + '%'"
          [bar]="{ value: analysisProgress(), max: 100, indeterminate: false }"
          cancelTitle="Cancel the running analysis"
          (cancel)="onCancel()"
        />
      }
    </div>
  } @else if (emptyHistory()) {
    <div class="analysis-loading">
      <p>{{ emptyMessage }}</p>
    </div>
  } @else {
    <div class="chart-container">
      <canvas #chartCanvas width="600" height="300"></canvas>
    </div>
  }
</vt-modal>
