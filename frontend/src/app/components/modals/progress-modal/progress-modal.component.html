<vt-modal [title]="title" [open]="true" (closed)="onCancel()">
  @if (analyzing) {
    <div class="analysis-loading">
      @if (!runningJob) {
        <p aria-live="polite">Loading indicator history…</p>
      } @else {
        <vt-job-progress
          aria-live="polite"
          header="Training detectors over label history"
          [eta]="analysisProgress + '%'"
          [bar]="{ value: analysisProgress, max: 100, indeterminate: false }"
          cancelTitle="Cancel the running analysis"
          (cancel)="onCancel()"
        />
      }
    </div>
  }
  @if (!analyzing && emptyHistory) {
    <div class="analysis-loading">
      <p>No score history available yet. Label more items to build up history.</p>
    </div>
  }
  <!-- The canvas stays mounted for the partial series too, so a long job draws
       its curve underneath the progress bar as the steps come in. -->
  @if ((!analyzing && !emptyHistory) || partialData.length) {
    <div class="chart-container">
      <canvas #chartCanvas width="600" height="300"></canvas>
    </div>
  }
</vt-modal>
