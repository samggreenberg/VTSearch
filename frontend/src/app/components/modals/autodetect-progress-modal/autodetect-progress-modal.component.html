<vt-modal title="Running Auto-Detect" [open]="true" (closed)="close()">
  <div class="autodetect-progress" aria-live="polite">
    <vt-job-progress
      [header]="statusText"
      [eta]="progress + '%'"
      [bar]="{ value: progress, max: 100, indeterminate: false }"
      cancelTitle="Cancel the auto-detect process"
      (cancel)="onCancel()"
    />
  </div>
</vt-modal>
