<vt-modal title="Achievements" [open]="true" (closed)="close()">
  <vt-toasty-hint hintId="achievements">
    Achievements are milestones tracked as you use VTSearch, with a tier for each. Your progress is
    saved with your settings, so it carries over between sessions.
  </vt-toasty-hint>
  <vt-achievements-tab />
  <div modal-footer>
    <button class="btn btn--secondary" (click)="close()" title="Close the achievements panel">Close</button>
  </div>
</vt-modal>
