@if (auth.needsLogin) {
  <vt-login (loggedIn)="auth.checkStatus()" />
} @else {
<header>
  <nav class="burger-menu" aria-label="Main menu">
    <button
      class="burger-btn"
      aria-label="Menu"
      [attr.aria-expanded]="menuOpen"
      aria-haspopup="true"
      (click)="toggleMenu($event)"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <div
      class="burger-dropdown"
      [class.show]="menuOpen"
      role="menu"
      aria-label="Main menu"
      (keydown)="onMenuKeydown($event)"
    >
      <div
        class="burger-item"
        [class.disabled]="!isOnLabelView"
        role="menuitem"
        tabindex="-1"
        (click)="onDashboard()"
      >Dashboard</div>
      <div
        class="burger-item"
        role="menuitem"
        tabindex="-1"
        (click)="onSettings()"
      >Settings</div>
    </div>
  </nav>
  <h1>VTSearch</h1>
  <a href="mailto:?subject=VTSearch%20Isssue%3A" title="Email us with any comments, concerns or suggestions!">
    <img src="logo.png" alt="VTSearch logo" class="header-logo">
  </a>
</header>
<div class="main-content" role="main">
  <router-outlet />
</div>
@if (showSettings) {
  <vt-settings-modal [preselectedViewTab]="settingsViewTab" (closed)="showSettings = false" />
}
<vt-dialog-host />
}
