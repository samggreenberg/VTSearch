name: Pyright

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # Hard gate: must pass for the PR to merge.
  # Covers the whole vtsearch/ package (pyrightconfig.json `include`).
  gated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vtsearch + deps (CPU)
        run: |
          set +e
          bash scripts/install-cpu.sh 2>&1 | tee /tmp/install.log
          status=${PIPESTATUS[0]}
          {
            echo "## Install step (exit=$status)"
            echo ""
            echo '```'
            tail -c 60000 /tmp/install.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Install pyright
        run: npm install -g pyright@1.1.408

      - name: Pyright (gated scope)
        run: |
          set +e
          pyright 2>&1 | tee /tmp/pyright-gated.log
          status=${PIPESTATUS[0]}
          {
            echo "## Pyright gated scope"
            echo ""
            echo "Exit status: \`$status\`"
            echo ""
            echo '```'
            tail -c 60000 /tmp/pyright-gated.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Drift guard for the OpenAPI spec snapshot at frontend/openapi.json.
      # Regenerate from the running Flask app (via flask-smorest) and fail
      # if the result differs from what's checked in — same install step
      # already paid for above, so this only adds the dump + diff cost.
      # The frontend's TS client is generated from this snapshot
      # (see frontend/ng-openapi-gen.json + npm run generate-api-client),
      # so out-of-date snapshot == out-of-date generated client.
      - name: OpenAPI snapshot drift check
        run: |
          set +e
          python scripts/dump_openapi.py > /tmp/openapi.regenerated.json 2>/tmp/openapi.dump.log
          dump_status=$?
          if [ "$dump_status" -ne 0 ]; then
            echo "Spec dump failed (exit=$dump_status); see log:" >&2
            cat /tmp/openapi.dump.log >&2
            exit "$dump_status"
          fi
          if ! diff -u frontend/openapi.json /tmp/openapi.regenerated.json > /tmp/openapi.diff; then
            {
              echo "## OpenAPI snapshot is stale"
              echo ""
              echo "Run \`npm run regenerate-openapi-snapshot\` (or \`python scripts/dump_openapi.py > frontend/openapi.json\`) and commit the result."
              echo ""
              echo '```diff'
              head -c 60000 /tmp/openapi.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Snapshot matches the live spec."
