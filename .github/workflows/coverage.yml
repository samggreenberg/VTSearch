name: Coverage

# Runs the fast CPU test suite with line + branch coverage, publishes
# the HTML report as an artifact + a per-file summary to the workflow's
# step summary, and gates pull requests on the coverage of lines they
# changed (via diff-cover).  The total-coverage number is *not* gated —
# only patch-level coverage is — because total moves up and down with
# unrelated test reshuffles and would be noisy.
#
# This is the first workflow that runs pytest in CI; local development
# still uses `./run-tests.sh`. The marker expression (`not gpu and not
# slow`) matches the default fast-loop suite.
#
# The Angular frontend is built before pytest because several tests
# (tests/core/test_frontend.py, tests/api/test_dashboard.py) assert that
# `/static/main.js`, `/static/polyfills.js`, `/static/styles.css` are
# served — those files only exist after `npm run build:prod` populates
# the `static/` directory.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the merge-base commit to compute the patch
          # diff.  Fetch the full history on PR runs; push runs only need
          # the tip so leave them on the default shallow checkout.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular frontend (populates static/)
        run: |
          set +e
          (cd frontend && npm ci && npm run build:prod) 2>&1 | tee /tmp/frontend-build.log
          status=${PIPESTATUS[0]}
          {
            echo "## Frontend build (exit=$status)"
            echo ""
            echo '```'
            tail -c 60000 /tmp/frontend-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Install vtsearch + deps (CPU)
        run: |
          set +e
          bash scripts/install-cpu.sh 2>&1 | tee /tmp/install.log
          status=${PIPESTATUS[0]}
          {
            echo "## Install step (exit=$status)"
            echo ""
            echo '```'
            tail -c 60000 /tmp/install.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: pip install diff-cover

      - name: Run fast tests with coverage
        id: pytest
        run: |
          set +e
          python -m pytest tests/ \
            -q --tb=short --no-header -n auto \
            -m 'not gpu and not slow' \
            --cov=vtsearch \
            --cov-report=term \
            --cov-report=html:coverage_html \
            --cov-report=xml:coverage.xml \
            2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Trim the noisy middle of the log when writing to the summary.
          {
            echo "## Pytest (exit=$status)"
            echo ""
            echo '```'
            tail -c 60000 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Re-render the coverage report from the .coverage data file so we
      # get a clean per-file table in the step summary, independent of
      # whatever pytest printed. Runs even when pytest fails so reviewers
      # see coverage on failing PRs too — useful for spotting "this PR
      # didn't add tests for the new code that failed".
      - name: Publish coverage summary
        if: always() && hashFiles('.coverage*') != ''
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            python -m coverage report --skip-covered --sort=cover 2>&1 || \
              python -m coverage report 2>&1
            echo '```'
            echo ""
            echo "Download the **coverage-html** artifact for the per-line drill-down."
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate PRs on patch-level coverage only: how well the lines this PR
      # added/changed are covered by tests.  Total-coverage gating is
      # intentionally avoided — it moves with unrelated test reshuffles
      # and produces noisy red on PRs that didn't touch tested code.
      # Threshold of 80% is a starting point; revisit once we have a few
      # PRs of data on how realistic it is.
      - name: Patch coverage gate (diff-cover)
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage.xml') != ''
        run: |
          set +e
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 \
            --markdown-report=/tmp/diff-cover.md \
            2>&1 | tee /tmp/diff-cover.log
          status=${PIPESTATUS[0]}
          {
            echo "## Patch coverage (diff-cover, fail-under=80%)"
            echo ""
            if [ -f /tmp/diff-cover.md ]; then
              cat /tmp/diff-cover.md
            else
              echo '```'
              tail -c 60000 /tmp/diff-cover.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload HTML coverage report
        if: always() && hashFiles('coverage_html/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 14

      - name: Upload coverage XML
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
