# LabBench CPU deployment — image search with SigLIP only.
#
# Streamlined for the LabBench environment: browsing/voting on images
# with the SigLIP embedder. The SigLIP weights are baked into the image
# at build time, so the container is ready to serve on first run.
#
#   docker compose -f docker/compose/docker-compose.labbench.yml up
#   docker compose -f docker/compose/docker-compose.labbench.yml up -d
#   docker compose -f docker/compose/docker-compose.labbench.yml down

services:
  vtsearch:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.labbench
    image: vtsearch:labbench
    ports:
      - "5000:5000"
    volumes:
      - vtsearch-data:/app/data
    restart: unless-stopped

volumes:
  vtsearch-data:
