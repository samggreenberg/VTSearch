# CPU deployment
#
# Run from the repo root:
#   docker compose -f docker/compose/docker-compose.yml up              — build & run
#   docker compose -f docker/compose/docker-compose.yml up -d           — detached
#   docker compose -f docker/compose/docker-compose.yml down            — stop & remove
#   docker compose -f docker/compose/docker-compose.yml build --no-cache — force rebuild

services:
  vtsearch:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - vtsearch-data:/app/data
    restart: unless-stopped

volumes:
  vtsearch-data:
