# Video-only CPU deployment: the full CPU image locked to the video
# media type (VTSEARCH_SOLO_MEDIA_TYPE=video), with the X-CLIP weights baked
# in at build time so the container is ready to serve on first run.
# See docker/Dockerfile.solo.
#
#   docker compose -f docker/compose/docker-compose.video.yml up
#   docker compose -f docker/compose/docker-compose.video.yml up -d
#   docker compose -f docker/compose/docker-compose.video.yml down

services:
  vtsearch:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.solo
      args:
        MEDIA_TYPE: video
    image: vtsearch:video
    ports:
      - "5000:5000"
    volumes:
      - vtsearch-data:/app/data
    restart: unless-stopped

volumes:
  vtsearch-data:
