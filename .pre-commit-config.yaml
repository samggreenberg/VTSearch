# Pre-commit hooks for VTSearch.
#
# Install once after cloning:
#   pre-commit install
#
# (scripts/install.sh runs this for you when a .git dir is present.)
#
# Run manually against every file:
#   pre-commit run --all-files
#
# Bump pinned versions:
#   pre-commit autoupdate
#
# `./run-tests.sh` is the source of truth (ruff + codespell + deptry +
# pip-audit + pyright + OpenAPI snapshot drift + the frontend build +
# pytest, all in one go); these hooks just shorten the feedback loop
# so the ruff/codespell/deptry subset is caught at commit time instead
# of on the next `./run-tests.sh`. VTSearch has no GitHub Actions
# workflows; nothing runs on push.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        name: ruff check
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # These files are JSONC, not JSON.  Angular, TypeScript, pyright and
        # VS Code all document comment support in their own config files, and
        # this repo depends on it: the bundle-budget rationale lives in an
        # angular.json comment precisely because the Angular schema rejects
        # extra keys (08c17ca7).  The hook parses with a strict json.load, so
        # it rejects all eight of them.  That stayed invisible because
        # pre-commit only passes STAGED files -- editing one of these is rare,
        # and when it happens the hook blocks the commit outright with
        # "Failed to json decode" (#3795).  The hook is kept for real .json.
        exclude: |
          (?x)^(
            frontend/\.vscode/.*\.json|
            frontend/angular\.json|
            frontend/tsconfig(\.\w+)?\.json|
            pyrightconfig\.json
          )$
      - id: check-merge-conflict
      - id: check-added-large-files
        # 4 MB, not the default 500 KB.  This hook exists to keep datasets and
        # model weights out of git; report figures are rendered at print density
        # (200 dpi) and a multi-panel comparison runs ~1 MB, which the old cap
        # rejected - pushing studies to downsample their evidence to satisfy a
        # guard aimed at something else entirely.  Raised again from 2 MB for the
        # self-contained `report.html` study pages: one carries every figure
        # and every photograph inline, which is the whole point of the format,
        # and the alternative was degrading the evidence to fit the guard.
        args: ["--maxkb=4000"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # deptry needs the project's venv to resolve imports, so it runs as
  # a local hook against `python -m deptry` (installed via
  # requirements/base.txt's `[dev]` extra).
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: python -m deptry .
        language: system
        pass_filenames: false
        files: ^(vtsearch/|pyproject\.toml|requirements/)
