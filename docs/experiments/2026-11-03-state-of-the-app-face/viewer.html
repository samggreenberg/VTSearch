<!--
  Template for scripts/experiments/calibration/viewer.py.  The builder swaps the
  placeholder token in the payload script tag below for the study's JSON;
  everything else here is static, so this file is the whole of the viewer's
  behaviour and is edited directly rather than through a Python string.

  Do not write that token anywhere else in this file - not even in a comment.
  The substitution is a plain string replace, and a second occurrence silently
  doubles the page.  viewer.py asserts there is exactly one.

  Self-contained on purpose: no CDN, no fetch, no fonts.  These pages are read

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quality over clicks</title>
<style>
  :root {
    color-scheme: light;
    --plane:          #f9f9f7;
    --surface:        #fcfcfb;
    --ink:            #0b0b0b;
    --ink-2:          #52514e;
    --muted:          #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:   #0d0d0d;
      --surface: #1a1a19;
      --ink:     #ffffff;
      --ink-2:   #c3c2b7;
      --muted:   #898781;
      --grid:    #2c2c2a;
      --axis:    #383835;
      --border:  rgba(255,255,255,0.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7;
    --muted:#898781; --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--ink-2); margin: 0 0 18px; font-size: 13px; max-width: 90ch; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl > label.h {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  select {
    font: inherit; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--axis); background: var(--surface); color: var(--ink);
    min-width: 170px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 620px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--axis); border-radius: 999px; padding: 3px 11px 3px 8px;
    font-size: 13px; background: var(--surface); color: var(--ink-2); user-select: none;
  }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chip .sw { width: 11px; height: 11px; border-radius: 3px; background: var(--axis); flex: none; }
  .chip[data-on="1"] { color: var(--ink); border-color: currentColor; font-weight: 500; }
  /* The last selection in a group cannot be turned off; say so rather than
     ignoring the click. */
  .chip[data-locked="1"] { cursor: not-allowed; }
  .chip[data-locked="1"]::after {
    content: "\00a0\1F512"; font-size: 9px; opacity: .55; margin-left: -2px;
  }
  .chip:focus-within { outline: 2px solid var(--s1); outline-offset: 2px; }
  .radios { display: flex; gap: 4px; }
  .radios label {
    cursor: pointer; border: 1px solid var(--axis); padding: 5px 10px; font-size: 13px;
    background: var(--surface); color: var(--ink-2);
  }
  .radios label:first-of-type { border-radius: 6px 0 0 6px; }
  .radios label:last-of-type { border-radius: 0 6px 6px 0; }
  .radios input { position: absolute; opacity: 0; width: 0; height: 0; }
  .radios label[data-on="1"] { color: var(--ink); font-weight: 500; border-color: var(--ink-2); }
  .radios label:focus-within { outline: 2px solid var(--s1); outline-offset: 2px; }

  /* Draw-what toggles.  Square boxes rather than chips: a chip group is a
     subset of one dimension and these are two independent switches, so they
     must not read as "pick some of these". */
  .checks { display: flex; flex-direction: column; gap: 5px; }
  .checks label {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 13px; color: var(--ink-2); user-select: none;
  }
  .checks label[data-on="1"] { color: var(--ink); font-weight: 500; }
  .checks label[data-off="1"] { opacity: .4; cursor: not-allowed; }
  .checks input { accent-color: var(--s1); margin: 0; }
  .checks .why { font-size: 11px; color: var(--muted); margin: -2px 0 0 24px; max-width: 34ch; }

  .legend-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; margin-top: 6px; }
  .legend-key span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .legend-key svg { display: inline-block; width: 22px; height: 10px; overflow: visible; }
  /* Sits ABOVE the swatches, not below them: at sixty series the swatch list is
     taller than the viewport, so a warning under it is a warning nobody reads. */
  .legend-warn {
    font-size: 12.5px; color: var(--ink); margin-bottom: 7px;
    border-left: 3px solid var(--s2); padding: 3px 0 3px 9px;
  }
  .legend-warn b { font-weight: 600; }
  /* Cap the swatch list so a hairball's legend cannot push the chart itself
     off the screen; it scrolls in place instead. */
  .legend { max-height: 148px; overflow-y: auto; }

  /* Grid, not flex: a flex row lets the last panel of an uneven row stretch to
     the full width, so the same series is drawn at two different sizes on one
     screen and the small multiples stop being comparable. */
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 14px; }
  /* A lone panel - the overlay view, or a study with one series - must not
     stretch to the full page. The SVG scales its 660-wide viewBox to whatever
     width it gets, so a full-bleed panel renders 11px axis labels as
     billboards and pushes the rotated y-axis title off its own left edge. */
  .panels.one { grid-template-columns: minmax(0, 940px); justify-content: center; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 6px; position: relative; min-width: 0;
  }
  .panel h2 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  .panel .pn { font-size: 11px; color: var(--muted); margin: 0 0 6px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; opacity: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 9px; font-size: 12px; min-width: 140px;
    box-shadow: 0 4px 14px rgba(0,0,0,.13); transition: opacity .08s;
  }
  .tip table { border-collapse: collapse; }
  .tip td { padding: 1px 0; }
  .tip td.k { padding-right: 10px; }
  .tip td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .tip .hd { font-weight: 600; margin-bottom: 3px; }
  .tip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

  #legend {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin: 14px 0 0;
  }
  .legend-head { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .legend-head b { color: var(--ink); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }

  .note { color: var(--muted); font-size: 12px; margin: 14px 0 0; max-width: 100ch; }
  .note b { color: var(--ink-2); font-weight: 600; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  table.data { border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  table.data th, table.data td {
    border-bottom: 1px solid var(--grid); padding: 4px 12px 4px 0; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>

  <p class="note" id="reading"></p>

      const off = r * nT;
      for (let t = 0; t < nT; t++) {
        acc += dv[off + t];
        const bit = off + t;
        const on = (mask[bit >> 3] >> (7 - (bit & 7))) & 1;
        out[off + t] = on ? acc / enc.scale : NaNv;
      }
    }
    return out;
  }

  let A;
  try {
    A = {
      mean: await decode(P.agg.mean),
      sd: await decode(P.agg.sd),
      n: await decode(P.agg.n),
      cells: await decode(P.agg.cells),
      omean: P.agg.omean ? await decode(P.agg.omean) : null,
      on: P.agg.on ? await decode(P.agg.on) : null,
      sky: P.skyline ? await decode(P.skyline.mean) : null,
      skyN: P.skyline ? await decode(P.skyline.n) : null,
      runs: P.runs ? await decode(P.runs.values) : null,
      stops: P.stops ? await decode(P.stops.ints) : null,
      stopVals: P.stops ? await decode(P.stops.values) : null,
    };
  } catch (err) {
    document.getElementById("panels").innerHTML =
      '<p class="empty">This page needs a browser with <code>DecompressionStream</code> ' +
      "(Chrome 80+, Firefox 113+, Safari 16.4+).<br>" + String(err) + "</p>";
    return;
  }

  const nG = P.groups.length, nA = P.arms.length, nM = P.metrics.length, nT = P.t.length;
  const aggAt = (buf, g, a, m) => buf.subarray(((g * nA + a) * nM + m) * nT, ((g * nA + a) * nM + m + 1) * nT);
  const cellsAt = (g, a) => A.cells[g * nA + a];
  const rT = P.runs ? P.runs.t.length : 0;
  const runAt = (i, m) => A.runs.subarray((i * nM + m) * rT, (i * nM + m + 1) * rT);
  // The skyline is one number per (group, arm, metric), encoded with a trailing
  // axis of length 1 so it goes through the same delta codec as everything else.
  const skyAt = (g, a, m) => (A.sky ? A.sky[(g * nA + a) * nM + m] : NaNv);
  const skyNAt = (g, a, m) => (A.skyN ? A.skyN[(g * nA + a) * nM + m] : 0);
  // Each run's stopped point (#4939): an integer block of rows named by
  // `P.stops.cols` (group, arm, seed, click, fired), one column per run, and
  // the value of every metric at that click, one row per run.
  const SR = P.stops ? P.stops.ints.shape[1] : 0;
  const SCOL = P.stops ? Object.fromEntries(P.stops.cols.map((c, k) => [c, k])) : {};
  const stopInt = (col, i) => A.stops[SCOL[col] * SR + i];

  // ---- state --------------------------------------------------------------
  // The eight VALIDATED categorical slots, contrast-checked in both themes.
  const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
  const ALL = "__all__", EACH = "__each__";

  // Past the validated eight, hues are GENERATED on the golden angle so a
  // twelve-class overlay is drawable at all.  Two things keep that honest:
  // the generated hues start only where the validated ones run out (so the
  // common small overlay is still the checked palette), and lightness is
  // picked for the live theme rather than left to a var() nested inside an SVG
  // presentation attribute.  A theme flip re-renders; see the listener below.
  let DARK = false;
  function readTheme() {
    const t = document.documentElement.dataset.theme;
    DARK = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  readTheme();
  function paletteColor(i) {
    if (i < SERIES.length) return `var(${SERIES[i]})`;
    const h = Math.round((20 + (i - SERIES.length + 1) * 137.508) % 360);
    return `hsl(${h}, 62%, ${DARK ? 66 : 40}%)`;
  }
  //: The one hue used when colour carries no information - split mode, where
  //: every panel holds exactly one bold line and a second colour would be
  //: inviting a comparison the layout does not make.
  const SOLO = "var(--s1)";

  // Categories in the #3156 map are `<class>@<band>` - the same twelve classes at
  // three target sizes - and the band is that study's headline axis, so it gets
  // its own control. Parsed out of the category names rather than added to the
  // payload: every other study's categories are bare names, and a viewer that
  // needs a schema change per study is a viewer nobody reuses. The control
  // appears only when EVERY category carries a suffix and there is more than one
  // band to choose between, for the same reason the embedder chips hide
  // themselves at one embedder - a control with one option is furniture.
  //
  // Like the category control it offers all sizes pooled, each size as its own
  // line (#4635), or one size.  "Each size" splits only the POOLED line: every
  // category already names its size, so with categories split or one picked a
  // size split would add no line, only empty combinations.
  const BAND_ORDER = ["small", "medium", "large"];
  const bandOf = (c) => { const i = String(c).lastIndexOf("@"); return i < 0 ? null : String(c).slice(i + 1); };
  const BANDS = (() => {
    const bs = P.categories.map(bandOf);
    if (!bs.length || bs.some((b) => !b)) return [];
    const u = [...new Set(bs)];
    if (u.length < 2) return [];
    const rank = (b) => { const i = BAND_ORDER.indexOf(b); return i < 0 ? BAND_ORDER.length : i; };
    return u.sort((x, y) => rank(x) - rank(y) || x.localeCompare(y));
  })();
  const inBand = (c) => state.band === ALL || state.band === EACH || bandOf(c) === state.band;

  // The metrics on the menu, and the one the page opens on.  `P.view` is the
  // study's choice (viewer.py's --default-metric / --hide-metrics), carried in
  // the payload so a reskin keeps it.  A page without one offers every metric
  // and opens on F1 where the run emitted it (#4635), else on the first.  A
  // hidden metric is off the menu only - its numbers are still in the payload,
  // and `mi` below still indexes the full list.
  //
  // viewer.py's DEFAULT_METRIC names the same key, so the builder knows when a
  // study's choice would only repeat it.
  const OPEN_ON = "f1";
  const VIEW = P.view || {};
  const OFFERED = (() => {
    const hide = new Set(VIEW.hide || []);
    const keep = P.metrics.filter((m) => !hide.has(m.key));
    return keep.length ? keep : P.metrics;   // the builder refuses this; never offer nothing
  })();

  const state = {
    // A page whose datasets mean nothing pooled opens on each of them (#4959: one bench at three prevalences).
    dataset: P.datasets.length > 1 ? (VIEW.dataset === "each" ? EACH : ALL) : P.datasets[0],
    band: ALL,
    category: ALL,
    metric: (OFFERED.find((m) => m.key === VIEW.metric) || OFFERED.find((m) => m.key === OPEN_ON) || OFFERED[0]).key,
    embedders: new Set(P.embedders),
    arms: new Set(P.arms),
    seedMode: "avg",
    // "curve" or "stop" (#4939): the whole curve, or each run at the click
    // the app first said stop.
    show: "curve",
    // Both off on open: the plain shipped-performance read is the least
    // cluttered one, and each of these answers a follow-up question.
    oracle: false,
    overlay: false,
  };

  // What the page calls an embedder, where the study named it (#4655): a key
  // like `siglip+dinov3_patch` is one path, and read bare it looks like two
  // embedders compared.  A page without labels shows the keys.
  const EMB_LABEL = Object.assign(Object.create(null), P.embedder_labels || {});

  const gDataset = (g) => P.groups[g][0];
  const gEmb = (g) => P.groups[g][1];
  const gCat = (g) => P.groups[g][2];

  function datasetsInPlay() {
    return state.dataset === ALL || state.dataset === EACH ? P.datasets : [state.dataset];
  }
  function categoriesInPlay() {
    const ds = new Set(datasetsInPlay());
    const s = new Set();
    P.groups.forEach((g, i) => { if (ds.has(gDataset(i))) s.add(gCat(i)); });
    const all = [...s].sort().filter(inBand);
    return state.category === ALL || state.category === EACH ? all : all.filter((c) => c === state.category);
  }

  // ---- controls -----------------------------------------------------------
  $("title").textContent = P.title;
  $("subtitle").textContent = P.subtitle;

  const dsSel = $("ds");
  dsSel.innerHTML =
    (P.datasets.length > 1
      ? `<option value="${ALL}">All datasets — averaged together</option>` +
        `<option value="${EACH}">Each dataset — one line each</option>`
      : "") +
    P.datasets.map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
  dsSel.value = state.dataset;
  dsSel.onchange = () => { state.dataset = dsSel.value; fillCats(); render(); };

  const catSel = $("cat");
  function fillCats() {
    const cur = state.category;
    const ds = new Set(datasetsInPlay());
    const s = new Set();
    P.groups.forEach((g, i) => { if (ds.has(gDataset(i))) s.add(gCat(i)); });
    const cats = [...s].sort().filter(inBand);
    catSel.innerHTML =
      `<option value="${ALL}">All categories — averaged together</option>` +
      `<option value="${EACH}">Each category — one line each</option>` +
      cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    state.category = cur === ALL || cur === EACH || cats.includes(cur) ? cur : ALL;
    catSel.value = state.category;
  }
  catSel.onchange = () => { state.category = catSel.value; render(); };

  const bandSel = $("band");
  if (!BANDS.length) {
    $("bandWrap").style.display = "none";
  } else {
    bandSel.innerHTML =
      `<option value="${ALL}">All sizes — averaged together</option>` +
      `<option value="${EACH}">Each size — one line each</option>` +
      BANDS.map((b) => `<option value="${esc(b)}">${esc(b)}</option>`).join("");
    bandSel.value = state.band;
    // Narrowing the band can strip the category currently selected, so refill
    // rather than leaving a selection that names no group: `fillCats` falls back
    // to "all categories" when the current one is no longer on offer.  Asking
    // for each size drops a single picked category for the same reason: it has
    // one size, so the request would draw one line.
    bandSel.onchange = () => {
      state.band = bandSel.value;
      if (state.band === EACH && state.category !== EACH) state.category = ALL;
      fillCats();
      render();
    };
  }
  fillCats();

  const mSel = $("metric");
  mSel.innerHTML = OFFERED.map((m) => `<option value="${esc(m.key)}">${esc(m.label)}</option>`).join("");
  mSel.value = state.metric;
  mSel.onchange = () => { state.metric = mSel.value; render(); };

  // Embedders: a non-empty subset, a panel each when split and a hue each when
  // overlaid, never averaged.  Hidden entirely when the
  // study ran a single embedder - a control with one option is furniture.
  if (P.embedders.length < 2) $("embWrap").style.display = "none";
  chips($("emb"), P.embedders.map((e) => ({ id: e, label: EMB_LABEL[e] || e || "(unnamed)" })), state.embedders, render);
  // A review's session sets are one arm per balance (#4636), and the page says
  // so: the chips choose the beta the sessions RAN at, which the metric menu's
  // F1/4, F1 and F4 then score the returned set at.
  if (P.arms_control) {
    $("armsTitle").textContent = P.arms_control.title;
    $("armsHint").textContent = `— ${P.arms_control.hint}`;
  }
  chips($("arms"), P.arms.map((a) => ({ id: a, label: a })), state.arms, render);

  // Seeds: averaged, or each run on its own.  What "each" draws follows the
  // Show control: a line per run on the whole curve, a dot per run at its stop,
  // and each needs its own data, so the radio is enabled per mode.
  const eachBox = $("seedMode").querySelector('input[value="each"]');
  function setRadio(host, value) {
    host.querySelectorAll("input").forEach((inp) => { inp.checked = inp.value === value; });
    host.querySelectorAll("label").forEach((l) => l.dataset.on = l.querySelector("input").checked ? "1" : "0");
  }
  function syncSeeds() {
    const stop = state.show === "stop";
    $("eachWhat").textContent = stop ? "dot" : "line";
    const can = stop ? !!P.stops : !!P.runs;
    eachBox.disabled = !can;
    eachBox.closest("label").title = can ? "" : ((stop ? P.stops_note : P.runs_note) || "no per-seed data in this payload");
    eachBox.closest("label").style.opacity = can ? "" : ".45";
    if (!can && state.seedMode === "each") state.seedMode = "avg";
    setRadio($("seedMode"), state.seedMode);
  }
  $("seedMode").querySelectorAll("input").forEach((inp) => {
    inp.onchange = () => { state.seedMode = inp.value; syncSeeds(); render(); };
  });
  // Show: the whole curve, or only where the app said stop (#4939).  The stop
  // view opens on a dot per run - the scatter is what it is for - and the
  // reader can still average it down to one marker a series.
  const stopBox = $("showMode").querySelector('input[value="stop"]');
  if (!P.stops) {
    stopBox.disabled = true;
    stopBox.closest("label").title = P.stops_note ||
      "This page was built before the viewer recorded where the app said stop; rebuild it from its results.";
    stopBox.closest("label").style.opacity = ".45";
  }
  $("showMode").querySelectorAll("input").forEach((inp) => {
    inp.onchange = () => {
      state.show = inp.value;
      state.seedMode = state.show === "stop" ? "each" : (P.runs ? state.seedMode : "avg");
      setRadio($("showMode"), state.show);
      syncSeeds();
      render();
    };
  });
  syncSeeds();

  // The two draw toggles.  `oracle` is per-metric: the oracle is a CUT, so it
  // moves every metric that is a statement about one cut and none of the two
  // that integrate over all of them.  Rather than offer a switch that does
  // nothing on AUROC, the box disables itself and says why - the same rule the
  // embedder chips follow when a study ran one embedder.
  const oracleBox = $("oracleBox"), overlayBox = $("overlayBox");
  $("oracleLab").lastChild.textContent = `${ONAME}, dotted`;
  // A page with no cut to dot (the cost cut, on a page that retired cost)
  // offers no box at all, rather than one that is never live.
  if (!HAS_ORACLE) $("oracleLab").style.display = "none";
  oracleBox.checked = state.oracle;
  overlayBox.checked = state.overlay;
  oracleBox.onchange = () => { state.oracle = oracleBox.checked; render(); };
  overlayBox.onchange = () => { state.overlay = overlayBox.checked; render(); };
  function syncDraw(spec) {
    const stop = state.show === "stop";
    const can = HAS_ORACLE && !!spec.oracle && !stop;
    oracleBox.disabled = !can;
    $("oracleLab").dataset.off = can ? "0" : "1";
    $("oracleLab").dataset.on = can && state.oracle ? "1" : "0";
    $("oracleLab").title = can
      ? (OBEST
        ? "Draw the best the same ranking could have returned: on an F metric the best that F any cut reaches, " +
          "elsewhere the cut the run's objective would have drawn with the test labels in hand."
        : "Draw the same model cut where the test labels put the lowest weighted FPR + FNR: the cost objective's " +
          "oracle, which is no ceiling on precision or F.")
      : stop
        ? `The dotted cut is drawn over the whole curve; where the app said stop, each run shows its own value.`
        : (spec.ranking
          ? `${spec.label} integrates over every threshold, so the oracle CUT cannot move it — the two lines would be identical.`
          : `This run emitted no oracle cut for ${spec.label}.`);
    $("overlayLab").dataset.on = state.overlay ? "1" : "0";
    // Never leave a checked-but-inert box on screen.
    oracleBox.checked = can && state.oracle;
  }

  // Every chip group is a NON-EMPTY subset - arms exactly as much as embedders.
  // An empty one has no honest rendering: the page would either go blank or
  // quietly fall back to "all", and a reader who did not notice would take a
  // chart of everything for a chart of nothing.
  //
  // The last chip still on is therefore LOCKED rather than silently snapped
  // back. Both stop the same thing; only one of them tells the reader why the
  // click did nothing, and a control that ignores a click reads as broken.
  function chips(host, items, set, onChange) {
    host.innerHTML = "";
    items.forEach((it) => {
      const lab = document.createElement("label");
      lab.className = "chip";
      lab.innerHTML = `<input type="checkbox"><span class="sw"></span><span>${esc(it.label)}</span>`;
      const box = lab.querySelector("input");
      box.checked = set.has(it.id);
      box.onchange = () => {
        if (box.checked) set.add(it.id);
        else if (set.size > 1) set.delete(it.id);
        else { box.checked = true; return; }   // the lock, as a failsafe
        host._sync();
        onChange();
      };
      host.appendChild(lab);
      lab._box = box; lab._id = it.id;
    });
    host._sync = () => {
      const last = set.size === 1;
      [...host.children].forEach((lab) => {
        const on = set.has(lab._id);
        lab.dataset.on = on ? "1" : "0";
        const col = on ? (host._colorOf ? host._colorOf(lab._id) : "") : "";
        lab.querySelector(".sw").style.background = col || "var(--axis)";
        lab.querySelector(".sw").style.visibility = host._colorOf ? "visible" : "hidden";
        const locked = on && last;
        lab.dataset.locked = locked ? "1" : "0";
        lab.title = locked ? "At least one must stay selected" : "";
      });
    };
    host._sync();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // ---- the series model ---------------------------------------------------
  //
  // Two modes, chosen by the reader rather than inferred:
  //
  //   SPLIT (default) - every dimension that varies becomes a PANEL, so each
  //     panel carries exactly one bold line plus the +/-1 SD shadow of the
  //     population under it.  The line is drawn in one colour, because with a
  //     single series per panel hue would be decoration and a reader is
  //     entitled to assume any colour difference means something.  This is the
  //     shadow's honest home: two shaded bands over one another are two clouds
  //     nobody can read the overlap of.
  //
  //   OVERLAY - every dimension that varies becomes a HUE and everything lands
  //     on one chart, with the shadows dropped.  This is the comparison view:
  //     bikes vs birds, SigLIP vs CLIP, arm vs arm, all against one y-scale.
  //
  // Overlaying two embedders is not averaging them - the ban that keeps
  // embedders in separate panels is a ban on pooling two representations of the
  // haystack into one number, and drawing two lines pools nothing.
  const DIMS = ["embedder", "arm", "band", "category", "dataset"];
  //: What a dimension is called on screen, where its key would not say it.
  //: The arms are whatever the arms control says they are: a review's session
  //: sets are a beta (#4636).
  const DIM_LABEL = { band: "target size", ...(P.arms_control ? { arm: P.arms_control.title.toLowerCase() } : {}) };
  const dimLabel = (d) => DIM_LABEL[d] || d;

  function plan() {
    const values = {
      embedder: P.embedders.filter((e) => state.embedders.has(e)),
      arm: P.arms.filter((a) => state.arms.has(a)),
      // `null` means "pooled over everything in play" rather than a single value.
      // One size is a filter on the categories in play, not a split, so it is
      // `null` here too; only "each size" over the pooled line splits.
      band: state.band === EACH && state.category === ALL ? BANDS : [null],
      category: state.category === EACH ? categoriesInPlay() : [state.category === ALL ? null : state.category],
      dataset: state.dataset === EACH ? datasetsInPlay() : [state.dataset === ALL ? null : state.dataset],
    };
    const varying = DIMS.filter((d) => values[d].length > 1);
    return { values, varying, overlay: state.overlay, hueDims: state.overlay ? varying : [], facetDims: state.overlay ? [] : varying };
  }

  // Colour follows the VALUE, not its position in the current selection, so
  // deselecting one series never repaints the survivors.  With several
  // dimensions varying at once the index is mixed-radix over the STUDY's own
  // lists - each digit is that value's position in the study, so removing a
  // category leaves every other series' colour exactly where it was.
  const ORDER = {
    embedder: (v) => P.embedders.indexOf(v),
    arm: (v) => P.arms.indexOf(v),
    band: (v) => BANDS.indexOf(v),
    category: (v) => P.categories.indexOf(v),
    dataset: (v) => P.datasets.indexOf(v),
  };
  const SIZE = {
    embedder: () => Math.max(1, P.embedders.length),
    arm: () => Math.max(1, P.arms.length),
    band: () => Math.max(1, BANDS.length),
    category: () => Math.max(1, P.categories.length),
    dataset: () => Math.max(1, P.datasets.length),
  };
  function hueIndex(hueDims, sel) {
    let i = 0;
    for (const d of hueDims) i = i * SIZE[d]() + Math.max(0, ORDER[d](sel[d]));
    return i;
  }

  function groupsFor(sel) {
    const inPlay = categoriesInPlay().filter((c) => sel.band === null || bandOf(c) === sel.band);
    const cats = new Set(sel.category === null ? inPlay : [sel.category]);
    const dss = new Set(sel.dataset === null ? datasetsInPlay() : [sel.dataset]);
    const out = [];
    P.groups.forEach((_, i) => {
      if (gEmb(i) === sel.embedder && dss.has(gDataset(i)) && cats.has(gCat(i))) out.push(i);
    });
    return out;
  }

  // ---- pooling ------------------------------------------------------------
  // Exact, because the payload carries n beside the moments: a mean of means
  // would weight a category that trained on 3 cells like one that trained on
  // 42, which is the survivorship the coverage strip exists to expose.
  function pooled(groups, ai, mi) {
    const mean = new Float64Array(nT).fill(NaNv);
    const sd = new Float64Array(nT).fill(NaNv);
    const cov = new Float64Array(nT);
    // The oracle carries its own weights: an oracle that declines to flag
    // anything has no precision at a click where the trained cut's precision
    // is perfectly well defined, so the two are not measured on the same cells.
    const omean = new Float64Array(nT).fill(NaNv);
    const ocov = new Float64Array(nT);
    let cells = 0;
    for (const g of groups) cells += cellsAt(g, ai);
    for (let t = 0; t < nT; t++) {
      let n = 0, s1 = 0, s2 = 0, on = 0, os1 = 0;
      for (const g of groups) {
        const c = aggAt(A.n, g, ai, mi)[t];
        if (A.omean) {
          const oc = aggAt(A.on, g, ai, mi)[t];
          const omu = aggAt(A.omean, g, ai, mi)[t];
          if (oc > 0 && Number.isFinite(omu)) { on += oc; os1 += oc * omu; }
        }
        if (!(c > 0)) continue;
        const mu = aggAt(A.mean, g, ai, mi)[t];
        const s = aggAt(A.sd, g, ai, mi)[t];
        if (!Number.isFinite(mu)) continue;
        n += c; s1 += c * mu; s2 += c * (s * s + mu * mu);
      }
      if (n > 0) {
        const mu = s1 / n;
        mean[t] = mu;
        sd[t] = Math.sqrt(Math.max(0, s2 / n - mu * mu));
      }
      if (on > 0) omean[t] = os1 / on;
      cov[t] = cells > 0 ? n / cells : 0;
      ocov[t] = cells > 0 ? on / cells : 0;
    }
    return { mean, sd, cov, omean, ocov, cells };
  }

  // The supervised skyline, pooled the same way and for the same reason: it is
  // a per-cell number, so "all categories" must weight it by the cells that
  // produced one.  Returns NaN when this run measured no skyline.
  function skyline(groups, ai, mi) {
    if (!A.sky) return NaNv;
    let n = 0, s1 = 0;
    for (const g of groups) {
      const c = skyNAt(g, ai, mi), v = skyAt(g, ai, mi);
      if (c > 0 && Number.isFinite(v)) { n += c; s1 += c * v; }
    }
    return n > 0 ? s1 / n : NaNv;
  }

  function runLines(groups, ai, mi) {
    if (!P.runs) return [];
    const want = new Set(groups);
    const out = [];
    P.runs.index.forEach((ix, i) => {
      if (ix[1] !== ai || !want.has(ix[0])) return;
      const v = runAt(i, mi);
      for (let t = 0; t < rT; t++) if (Number.isFinite(v[t])) { out.push(v); return; }
    });
    return out;
  }

  // Kaplan-Meier median of the clicks the app said stop at, the runs it never
  // told to stop carried as censored at their last click: stopping.km_median,
  // which a review's stopping table quotes.  A mean over the runs that stopped
  // drops exactly the slow ones, so the median is NaN - no marker - when fewer
  // than half the runs ever stopped.
  function kmMedian(events, censored) {
    if (!events.length) return NaNv;
    const ev = new Map(), ce = new Map();
    for (const t of events) ev.set(t, (ev.get(t) || 0) + 1);
    for (const t of censored) ce.set(t, (ce.get(t) || 0) + 1);
    let atRisk = events.length + censored.length, surv = 1;
    for (const t of [...new Set([...ev.keys(), ...ce.keys()])].sort((a, b) => a - b)) {
      const d = ev.get(t) || 0;
      if (d && atRisk > 0) {
        surv *= 1 - d / atRisk;
        if (surv <= 0.5) return t;
      }
      atRisk -= d + (ce.get(t) || 0);
    }
    return NaNv;
  }

  // One series' stopped points (#4939): every run in its groups and arm, at
  // the click the app first said stop (fired) or its last click (never told),
  // and what a reader quotes about them.  The mean and SD at the stop are over
  // the runs that stopped, since a stop is all they describe; the runs never
  // told to stop are counted beside them, with their value at the last click.
  function stopSummary(groups, ai, mi) {
    if (!A.stops) return null;
    const want = new Set(groups);
    const pts = [], firedT = [], neverT = [];
    let n = 0, s1 = 0, s2 = 0, nn = 0, ns1 = 0;
    for (let i = 0; i < SR; i++) {
      if (stopInt("arm", i) !== ai || !want.has(stopInt("group", i))) continue;
      const t = stopInt("t", i), fired = stopInt("fired", i) > 0.5, v = A.stopVals[i * nM + mi];
      pts.push({ i, t, v, fired });
      (fired ? firedT : neverT).push(t);
      if (!Number.isFinite(v)) continue;
      if (fired) { n += 1; s1 += v; s2 += v * v; } else { nn += 1; ns1 += v; }
    }
    const mean = n ? s1 / n : NaNv;
    return {
      pts,
      runs: pts.length,
      fired: firedT.length,
      tMedian: kmMedian(firedT, neverT),
      mean,
      sd: n ? Math.sqrt(Math.max(0, s2 / n - mean * mean)) : NaNv,
      neverMean: nn ? ns1 / nn : NaNv,
    };
  }
  // A run's dot is spread by up to a third of a click, the same way every
  // time: clicks are whole numbers, and runs that stopped at one click would
  // otherwise sit on one another as a single dot.
  const jitter = (i) => (((i * 0.6180339887) % 1) - 0.5) * 0.66;

  // ---- render -------------------------------------------------------------
  const SOLID = P.solid_coverage;
  // "Fully measured", for deciding whether the coverage strip has anything to
  // show. Not 1.0: coverage is a ratio of integers and a pooled slice can land a
  // hair under it, which would keep a flat strip on screen forever.
  const COV_FLAT = 0.995;
  const MAX_PANELS = 16;
  const fmt = (v, d = 3) => (Number.isFinite(v) ? v.toFixed(d) : "—");
  const shortLabel = (dim, v) =>
    v === null ? ({ band: "all sizes", category: "all categories" }[dim] || "all datasets")
    : dim === "embedder" ? (EMB_LABEL[v] || String(v) || "(unnamed embedder)")
    : dim === "band" ? `${v} targets`
    : String(v);
  // In overlay the name has to name the COMBINATION, because that is what the
  // hue stands for; in split the panel title already carries every varying
  // dimension, so the series is named by its arm and nothing is said twice.
  function seriesName(pl, sel, useOverlay) {
    const dims = useOverlay ? pl.hueDims : [];
    return dims.length ? dims.map((d) => shortLabel(d, sel[d])).join(" · ") : String(sel.arm);
  }

  function render() {
    const host = $("panels");
    host.innerHTML = "";
    host.classList.remove("one");
    const pl = plan();
    const mi = P.metrics.findIndex((m) => m.key === state.metric);
    const spec = P.metrics[mi];
    const stopView = state.show === "stop" && !!A.stops;

    syncDraw(spec);
    // Chip swatches carry colour only where hue means something: overlay mode
    // with arm among the varying dimensions.  A swatch beside a chip in split
    // mode would promise a colour the chart never uses.
    $("arms")._colorOf = pl.hueDims.includes("arm")
      ? (v) => paletteColor(hueIndex(pl.hueDims, { embedder: pl.values.embedder[0], arm: v, band: pl.values.band[0], category: pl.values.category[0], dataset: pl.values.dataset[0] }))
      : null;
    $("arms")._sync();
    $("emb")._sync();

    // Every combination the selection names, as one flat list.  In overlay mode
    // they all land on one panel and are told apart by hue; in split mode each
    // one IS a panel and holds a single line.
    let combos = [{}];
    for (const dim of DIMS) {
      const next = [];
      for (const c of combos) for (const v of pl.values[dim]) next.push({ ...c, [dim]: v });
      combos = next;
    }
    const useOverlay = pl.overlay;
    let facetKeys = useOverlay ? [{}] : combos;
    let hidden = 0;
    if (facetKeys.length > MAX_PANELS) { hidden = facetKeys.length - MAX_PANELS; facetKeys = facetKeys.slice(0, MAX_PANELS); }

    const seriesFor = (fk) => (useOverlay ? combos : [fk]);
    const panels = facetKeys.map((fk) => {
      const per = [];
      for (const sel of seriesFor(fk)) {
        const ai = P.arms.indexOf(sel.arm);
        if (ai < 0) continue;
        const groups = groupsFor(sel);
        if (!groups.length) continue;
        per.push({
          sel, ai,
          color: useOverlay ? paletteColor(hueIndex(pl.hueDims, sel)) : SOLO,
          name: seriesName(pl, sel, useOverlay),
          agg: pooled(groups, ai, mi),
          sky: skyline(groups, ai, mi),
          runs: state.seedMode === "each" && !stopView ? runLines(groups, ai, mi) : [],
          stop: stopView ? stopSummary(groups, ai, mi) : null,
        });
      }
      return { fk, per };
    }).filter((p) => p.per.length);

    // One y-scale across every panel: two panels on two scales is a dual-axis
    // chart wearing a disguise.
    const showOracle = HAS_ORACLE && state.oracle && !!spec.oracle && !stopView;
    const showSky = panels.some((p) => p.per.some((q) => Number.isFinite(q.sky)));
    let lo = Infinity, hi = -Infinity;
    if (stopView) for (const p of panels) for (const q of p.per) {
      // The stopped points and the two notches, which still mark what typing
      // got for free and what every label buys.
      const s = q.stop;
      if (state.seedMode === "each") for (const pt of s.pts) {
        if (Number.isFinite(pt.v)) { lo = Math.min(lo, pt.v); hi = Math.max(hi, pt.v); }
      } else if (Number.isFinite(s.mean)) {
        const sd = Number.isFinite(s.sd) ? s.sd : 0;
        lo = Math.min(lo, s.mean - sd); hi = Math.max(hi, s.mean + sd);
      }
      for (const v of [P.anchor.has ? q.agg.mean[0] : NaNv, q.sky]) {
        if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
      }
    }
    else for (const p of panels) for (const q of p.per) {
      for (let t = 0; t < nT; t++) {
        const m = q.agg.mean[t], sd = q.agg.sd[t];
        if (!Number.isFinite(m)) continue;
        // The shadow is drawn only where it is honest - one line per panel -
        // so it only widens the scale there.
        const wide = !useOverlay && state.seedMode === "avg" && Number.isFinite(sd);
        lo = Math.min(lo, wide ? m - sd : m);
        hi = Math.max(hi, wide ? m + sd : m);
      }
      if (showOracle) for (let t = 0; t < nT; t++) {
        const o = q.agg.omean[t];
        if (Number.isFinite(o)) { lo = Math.min(lo, o); hi = Math.max(hi, o); }
      }
      // The notches are the whole point of the left and right margins: a
      // skyline clipped off the bottom is a floor the reader cannot see.
      if (Number.isFinite(q.sky)) { lo = Math.min(lo, q.sky); hi = Math.max(hi, q.sky); }
      for (const v of q.runs) for (let t = 0; t < rT; t++) {
        if (Number.isFinite(v[t])) { lo = Math.min(lo, v[t]); hi = Math.max(hi, v[t]); }
      }
    }
    if (!Number.isFinite(lo) || !panels.length) {
      host.innerHTML = '<p class="empty">Nothing measured in this slice.</p>';
      $("reading").textContent = ""; $("table").innerHTML = ""; $("legend").innerHTML = "";
      return;
    }
    const pad = (hi - lo) * 0.06 || 0.02;
    lo = Math.max(spec.lo, lo - pad); hi = Math.min(spec.hi, hi + pad);

    // Does the coverage strip earn its space in THIS selection?
    //
    // It exists to expose survivorship: a mean at click 140 pooled from a third
    // of the cells is a different quantity from one pooled from all of them, and
    // nothing else on the page says which you are looking at. But in a study
    // where every cell runs to the horizon it is a flat 100% line under every
    // panel -- a fifth of each panel's height, in every panel, carrying one bit
    // that never changes. Same rule as the embedder chips at one embedder: an
    // axis with one value is furniture.
    //
    // The run-up does NOT count as variation. Coverage climbs from nothing to
    // full over the first clicks because detectors only start once a run has
    // both classes, and the main chart already says so by DASHING the mean
    // there. So the strip's only unique information is a dip AFTER every series
    // has come up, and that is exactly what this tests.
    //
    // Decided across all panels rather than per panel: panels of two different
    // heights are two charts, which is why the y-scale is shared already.
    let covStart = -1;
    for (let t = 1; t < nT && covStart < 0; t++) {
      let all = true;
      for (const p of panels) for (const q of p.per) if (!(q.agg.cov[t] >= COV_FLAT)) all = false;
      if (all) covStart = t;
    }
    // The stopped points have no click axis to be measured along: the strip
    // is a statement about the whole curve.
    let showCov = !stopView;
    if (showCov && covStart >= 0) {
      let covMin = 1;
      for (const p of panels) for (const q of p.per) {
        for (let t = covStart; t < nT; t++) if (Number.isFinite(q.agg.cov[t])) covMin = Math.min(covMin, q.agg.cov[t]);
      }
      showCov = covMin < COV_FLAT;
    }

    const nSeries = new Set(panels.flatMap((p) => p.per.map((q) => q.name))).size;
    const opt = { showCov, showOracle, showSky, useOverlay, nSeries, stopView };
    host.classList.toggle("one", panels.length === 1);
    for (const p of panels) host.appendChild(panel(p, pl, spec, lo, hi, opt));
    legend(pl, panels, opt);
    reading(spec, pl, hidden, facetKeys.length, opt);
    (stopView ? stopTable : tableView)(spec, panels, opt);
  }

  // A theme flip changes the lightness the generated hues are picked at, and
  // those are baked into the SVG rather than left to a CSS variable, so the
  // page has to redraw.  Cheap: everything is already in memory.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); render(); });

  const W = 660, H = 300, CH = 54, M = { l: 56, r: 14, t: 10, b: 26 };

  function panelTitle(fk, pl) {
    const bits = [];
    if (P.embedders.length > 1 && "embedder" in fk) bits.push(shortLabel("embedder", fk.embedder));
    for (const dim of pl.facetDims) if (dim !== "embedder" && dim in fk) bits.push(shortLabel(dim, fk[dim]));
    if (bits.length) return bits.join(" · ");
    return (P.embedders.length === 1 ? EMB_LABEL[P.embedders[0]] || P.embedders[0] : "") || P.title;
  }

  function panelSub(pl, fk) {
    const bits = [];
    const splits = (d) => pl.hueDims.includes(d) || pl.facetDims.includes(d);
    bits.push(splits("dataset")
      ? null
      : (state.dataset === ALL ? `all ${P.datasets.length} datasets pooled` : state.dataset));
    // The size this panel pools: its own when the sizes are split one chart
    // each, the one picked, or none.
    const band = fk.band != null ? fk.band : (state.band === ALL || state.band === EACH ? null : state.band);
    const nCats = categoriesInPlay().filter((c) => band === null || bandOf(c) === band).length;
    const pooled = band === null
      ? (splits("band") ? "each size's categories pooled" : `all ${nCats} categories pooled`)
      : `all ${nCats} ${band}-band categories pooled`;
    bits.push(splits("category")
      ? (band === null ? null : `${band} band`)
      : (state.category === ALL ? pooled : state.category));
    bits.push(state.seedMode === "each" ? "every seed" : "seeds averaged");
    return bits.filter(Boolean).join(" · ");
  }

  function panel(pnl, pl, spec, lo, hi, opt) {
    const { showCov, showOracle, useOverlay } = opt;
    const el = document.createElement("div");
    el.className = "panel";
    const tmax = P.t[nT - 1];
    const x = (t) => M.l + (t / tmax) * (W - M.l - M.r);
    const y = (v) => M.t + (1 - (v - lo) / (hi - lo || 1)) * (H - M.t - M.b);
    const yc = (c) => H + 16 + (1 - c) * (CH - 22);

    const nCells = pnl.per.reduce((a, q) => a + q.agg.cells, 0);
    // In overlay the panel IS the page, so its heading would be the <h1> again.
    const head = useOverlay ? "" : panelTitle(pnl.fk, pl);
    // Where the app said stop, the fire rate comes first (#3560): every
    // reading of the dots is conditional on it.
    const told = opt.stopView ? pnl.per.reduce((a, q) => a + q.stop.fired, 0) : 0;
    const runs = opt.stopView ? pnl.per.reduce((a, q) => a + q.stop.runs, 0) : 0;
    el.innerHTML =
      (head ? `<h2>${esc(head)}</h2>` : "") +
      `<p class="pn">${esc(panelSub(pl, pnl.fk))} · ${nCells} cell${nCells === 1 ? "" : "s"}` +
      (opt.stopView ? ` · the app said stop in ${told} of ${runs} run${runs === 1 ? "" : "s"}` : "") + `</p>`;

    const parts = [];
    const yticks = ticks(lo, hi, 5);
    const xt = clickTicks(tmax, W - M.l - M.r);
    for (const v of yticks) parts.push(
      `<line x1="${M.l}" x2="${W - M.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`,
      `<text x="${M.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${trim(v)}</text>`);
    for (const t of xt.marks) parts.push(
      `<line x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${H - M.b}" y2="${H - M.b + 4}" stroke="var(--axis)"/>`);
    for (const t of xt.labels) parts.push(
      `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${Math.round(t)}</text>`);
    parts.push(`<line x1="${M.l}" x2="${W - M.r}" y1="${H - M.b}" y2="${H - M.b}" stroke="var(--axis)"/>`);

    // The click-0 anchor is a NOTCH, not the first point of the curve, and
    // nothing joins it to the curve.  The dotted bridge that used to run from
    // the text sort to the first trained click was drawing across a stretch
    // where nothing was measured, in the one place a reader's eye goes first;
    // a gap says the same thing and asserts nothing.  So the curves start at
    // the first trained click and the two reference marks sit in the margins.
    const t0 = P.anchor.has ? 1 : 0;
    const ts = P.t.slice(t0);
    const NOTCH = 12;
    const clamp = (v) => Math.min(hi, Math.max(lo, v));
    const inRange = (v) => Number.isFinite(v) && v >= lo && v <= hi;

    for (const q of pnl.per) {
      if (opt.stopView) stopMarks(parts, q, x, y, lo, hi);
      else if (state.seedMode === "each") {
        for (const v of q.runs) {
          const from = P.anchor.has && P.runs.t[0] === 0 ? 1 : 0;
          parts.push(
            `<path d="${path(P.runs.t.slice(from), v.subarray(from), x, y, lo, hi, true)}" fill="none" stroke="${q.color}" stroke-width="1" opacity="0.16"/>`);
          // A run that never trained has ONLY its click-0 value, and a
          // single-point path draws nothing - so it gets its own faint notch,
          // or total starvation renders as an absent line.
          if (P.anchor.has && inRange(v[0])) parts.push(
            `<line x1="${M.l.toFixed(1)}" x2="${(M.l + NOTCH * 0.6).toFixed(1)}" y1="${y(v[0]).toFixed(1)}" y2="${y(v[0]).toFixed(1)}" stroke="${q.color}" stroke-width="1" opacity="0.3"/>`);
        }
      } else if (!useOverlay) {
        // The shadow lives only in split mode.  Two translucent clouds over one
        // another are a third shape nobody can read, which is exactly why the
        // overlay drops them rather than stacking them.
        parts.push(`<path d="${band(q.agg, x, y, lo, hi, t0)}" fill="${q.color}" opacity="0.10"/>`);
      }
      // The mean, dashed wherever it describes fewer than SOLID of that
      // series' cells: there it is a level for a subset, not for the grid.
      if (!opt.stopView) parts.push(
        `<path d="${path(ts, q.agg.mean.subarray(t0), x, y, lo, hi, true)}" fill="none" stroke="${q.color}" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.85"/>`,
        `<path d="${path(ts, mask(q.agg.mean, q.agg.cov).subarray(t0), x, y, lo, hi)}" fill="none" stroke="${q.color}" stroke-width="2"/>`);
      // The oracle: the same model, cut with the test labels in hand.  Dotted
      // against the solid performance line, in the SAME hue, because it is not
      // another system - it is the ceiling this one's threshold left on the
      // table, and the gap between the two IS the calibration regret.
      if (showOracle) parts.push(
        `<path d="${path(ts, mask(q.agg.omean, q.agg.ocov).subarray(t0), x, y, lo, hi, true)}" fill="none" stroke="${q.color}" stroke-width="1.4" stroke-dasharray="1 3" stroke-linecap="round" opacity="0.95"/>`);
      // ...and its own notch, hard left and dotted like it: the text sort's
      // oracle, the best its ranking could have returned for free (#4654).
      if (showOracle && P.anchor.has && inRange(q.agg.omean[0])) parts.push(
        `<line x1="${M.l.toFixed(1)}" x2="${(M.l + NOTCH).toFixed(1)}" y1="${y(q.agg.omean[0]).toFixed(1)}" y2="${y(q.agg.omean[0]).toFixed(1)}" stroke="${q.color}" stroke-width="2.5" stroke-dasharray="1 3" stroke-linecap="round"/>`);
      // Baseline notch, hard left: what typing the query got for free.
      if (P.anchor.has && inRange(q.agg.mean[0])) parts.push(
        `<line x1="${M.l.toFixed(1)}" x2="${(M.l + NOTCH).toFixed(1)}" y1="${y(q.agg.mean[0]).toFixed(1)}" y2="${y(q.agg.mean[0]).toFixed(1)}" stroke="${q.color}" stroke-width="3"/>`);
      // Skyline notch, hard right: the same head trained on every label there
      // is.  A notch and not a rule across the panel, because it is a floor the
      // loop is walking toward, not a level it reached at click 3.
      if (inRange(q.sky)) parts.push(
        `<line x1="${(W - M.r - NOTCH).toFixed(1)}" x2="${(W - M.r).toFixed(1)}" y1="${y(q.sky).toFixed(1)}" y2="${y(q.sky).toFixed(1)}" stroke="${q.color}" stroke-width="3"/>`);
      if (showCov) {
        parts.push(
          `<path d="${path(P.t.slice(1), q.agg.cov.slice(1), x, yc, 0, 1)}" fill="none" stroke="${q.color}" stroke-width="1.2"/>`);
        // Click 0 is a point, not the start of the line: every cell is measured
        // there (it has a text sort) and none has a detector at click 1, so a
        // joined line renders two different facts as a spike.
        if (P.anchor.has && Number.isFinite(q.agg.cov[0])) parts.push(
          `<circle cx="${x(0).toFixed(1)}" cy="${yc(q.agg.cov[0]).toFixed(1)}" r="2" fill="${q.color}"/>`);
      }
    }
    if (showCov) parts.push(
      `<line x1="${M.l}" x2="${W - M.r}" y1="${yc(SOLID).toFixed(1)}" y2="${yc(SOLID).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="1 3"/>`,
      `<text x="${M.l - 8}" y="${(yc(1) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">100%</text>`,
      `<text x="${M.l - 8}" y="${(yc(0) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">0%</text>`,
      `<text x="${W - M.r}" y="${(yc(0) + 14).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">cells measured</text>`);
    const foot = showCov ? H + CH : H;
    parts.push(
      `<text x="${(M.l + (W - M.l) / 2).toFixed(0)}" y="${foot + 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${opt.stopView ? "the click the app said stop at" : "clicks spent"}${P.anchor.has ? "  (0 = the free text sort)" : ""}</text>`,
      `<text transform="translate(13,${(M.t + (H - M.b) / 2).toFixed(0)}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(spec.label)}</text>`);

    el.insertAdjacentHTML("beforeend",
      `<svg viewBox="0 0 ${W} ${foot + 20}" role="img" aria-label="${esc(spec.label)} against clicks">${parts.join("")}</svg>`);
    hover(el, pnl, spec, x, y, opt);
    return el;
  }

  // ---- legend -------------------------------------------------------------
  // Two jobs, and the second one is why it is always on screen: it says what
  // hue MEANS in this configuration - which the reader chose, and which
  // therefore changes - and it decodes the line styles, which carry as much of
  // the chart's meaning as the colours do.
  function legend(pl, panels, opt) {
    const host = $("legend");
    const heading = opt.useOverlay
      ? (pl.hueDims.length
        ? `Colour = <b>${pl.hueDims.map((d) => esc(dimLabel(d))).join(" × ")}</b>, all on one chart`
        : `One series`)
      : (panels.length > 1
        ? `<b>One chart per ${pl.facetDims.map((d) => esc(dimLabel(d))).join(" × ")}</b> — ` +
          (opt.stopView ? `one series each.` : `one line each, so the shaded spread underneath it is readable.`) +
          ` Colour carries no meaning here; tick <b>overlay on one chart</b> to compare them directly.`
        : `One series`);
    let rows = "", warn = "";
    if (opt.useOverlay) {
      const seen = new Map();
      for (const p of panels) for (const q of p.per) if (!seen.has(q.name)) seen.set(q.name, q.color);
      rows = `<div class="legend">` + [...seen].map(([name, col]) =>
        `<span><i style="background:${col}"></i>${esc(name)}</span>`).join("") + `</div>`;
      // The palette has 8 contrast-checked slots; past them hues are generated
      // on the golden angle so a twelve-class overlay is drawable at all. That
      // is a real trade and the reader is told where it starts, at the top,
      // where the swatch list has not already pushed it off screen.
      if (seen.size > SERIES.length) warn =
        `<div class="legend-warn"><b>${seen.size} series on one chart</b> — past the palette's ` +
        `${SERIES.length} contrast-checked slots, so the rest are generated on the golden angle: ` +
        `distinguishable, but not validated${seen.size > 20 ? ", and at this count the chart is a hairball" : ""}. ` +
        `Narrow the selection, or untick <b>overlay</b> for one chart each.</div>`;
    }
    const key = [];
    const stroke = (extra) => `<svg viewBox="0 0 22 10" aria-hidden="true"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--ink-2)" ${extra}/></svg>`;
    const dot = (extra) => `<svg viewBox="0 0 22 10" aria-hidden="true"><circle cx="11" cy="5" ${extra}/></svg>`;
    if (opt.stopView) {
      if (state.seedMode === "each") key.push(
        `<span>${dot('r="2.6" fill="var(--ink-2)" opacity=".55"')}a run, where the app said stop</span>`,
        `<span>${dot('r="2.6" fill="none" stroke="var(--ink-2)"')}a run never told to stop, at its last click</span>`);
      key.push(
        `<span><svg viewBox="0 0 22 10" aria-hidden="true"><line x1="11" y1="-3" x2="11" y2="13" stroke="var(--ink-2)" stroke-width="2"/><circle cx="11" cy="5" r="4" fill="var(--ink-2)"/></svg>median stop, mean there ±1 SD</span>`);
    } else {
      key.push(`<span>${stroke('stroke-width="2"')}measured level</span>`);
      key.push(`<span>${stroke('stroke-width="1.1" stroke-dasharray="3 3"')}a subset of the cells</span>`);
    }
    if (opt.showOracle) key.push(`<span>${stroke('stroke-width="1.4" stroke-dasharray="1 3" stroke-linecap="round"')}${ONAME}</span>`);
    if (P.anchor.has) key.push(
      `<span><svg viewBox="0 0 22 10" aria-hidden="true"><line x1="0" y1="5" x2="9" y2="5" stroke="var(--ink-2)" stroke-width="3"/></svg>${esc(P.anchor.label)}</span>`);
    if (opt.showSky) key.push(
      `<span><svg viewBox="0 0 22 10" aria-hidden="true"><line x1="13" y1="5" x2="22" y2="5" stroke="var(--ink-2)" stroke-width="3"/></svg>${esc(P.skyline.label)}</span>`);
    if (!opt.useOverlay && !opt.stopView) key.push(`<span><i style="width:16px;height:9px;border-radius:2px;background:${SOLO};opacity:.22;display:inline-block"></i>±1 SD across cells</span>`);
    host.innerHTML =
      warn + `<div class="legend-head">${heading}</div>` + rows +
      `<div class="legend-key">${key.join("")}</div>`;
  }

  // A series' stopped points (#4939).  Each run is a dot at the click the app
  // first said stop, filled; a run it never told to stop is hollow, at its last
  // click.  Over them, or alone when the seeds are averaged, the series'
  // marker: the median stop at the mean value there, with its ±1 SD bar.  No
  // marker where fewer than half the runs stopped: the median is unknown, and
  // a glyph drawn from the runs that did would hide the slow ones.
  function stopMarks(parts, q, x, y, lo, hi) {
    const s = q.stop;
    const clamp = (v) => Math.min(hi, Math.max(lo, v));
    if (state.seedMode === "each") for (const pt of s.pts) {
      if (!Number.isFinite(pt.v)) continue;
      const cx = x(pt.t + jitter(pt.i)).toFixed(1), cy = y(clamp(pt.v)).toFixed(1);
      parts.push(pt.fired
        ? `<circle cx="${cx}" cy="${cy}" r="2.4" fill="${q.color}" opacity="0.4"/>`
        : `<circle cx="${cx}" cy="${cy}" r="2.4" fill="none" stroke="${q.color}" stroke-width="1" opacity="0.6"/>`);
    }
    if (!Number.isFinite(s.tMedian) || !Number.isFinite(s.mean)) return;
    const cx = x(s.tMedian), cy = y(clamp(s.mean));
    if (s.sd > 0) {
      const top = y(clamp(s.mean + s.sd)), bot = y(clamp(s.mean - s.sd));
      parts.push(
        `<line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${top.toFixed(1)}" y2="${bot.toFixed(1)}" stroke="${q.color}" stroke-width="2"/>`,
        ...[top, bot].map((yy) =>
          `<line x1="${(cx - 4).toFixed(1)}" x2="${(cx + 4).toFixed(1)}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${q.color}" stroke-width="2"/>`));
    }
    parts.push(
      `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5.5" fill="${q.color}" stroke="var(--surface)" stroke-width="1.5"/>`);
  }

  function mask(vals, cov) {
    const out = new Float64Array(vals.length);
    for (let i = 0; i < vals.length; i++) out[i] = cov[i] >= SOLID ? vals[i] : NaNv;
    return out;
  }
  // `bridge` draws straight through the clicks with no measurement instead of
  // lifting the pen.  Used for the thin dashed line only, and that is the whole
  // reason it is dashed: it is what carries a series across a stretch of low or
  // absent coverage without claiming a level there.  The solid line never
  // bridges - a solid segment must be a level.
  //
  // It does NOT bridge the click-0 anchor to the first trained click any more.
  // That stretch is now a plain gap with a notch in the left margin: a dotted
  // line across it was the most prominent mark on the chart and it stood for a
  // measurement nobody made.
  function path(ts, vals, x, y, lo, hi, bridge) {
    let d = "", pen = false;
    for (let i = 0; i < ts.length; i++) {
      const v = vals[i];
      if (!Number.isFinite(v)) { if (!bridge) pen = false; continue; }
      const px = x(ts[i]).toFixed(1), py = y(Math.min(hi, Math.max(lo, v))).toFixed(1);
      d += (pen ? "L" : "M") + px + " " + py + " ";
      pen = true;
    }
    return d;
  }
  // Segmented on purpose.  Skipping the un-measured clicks and joining what is
  // left would draw one polygon straight across a stretch where nothing was
  // measured, which is the exact opposite of what the dashed-mean rule says
  // there.  Starts at *from* so the click-0 notch is never a corner of it.
  function band(agg, x, y, lo, hi, from) {
    const segs = [];
    let up = [], dn = [];
    const flush = () => {
      if (up.length > 1) segs.push("M" + up.join(" L") + " L" + dn.reverse().join(" L") + " Z");
      up = []; dn = [];
    };
    for (let i = from || 0; i < nT; i++) {
      const m = agg.mean[i], s = agg.sd[i];
      if (!Number.isFinite(m) || !Number.isFinite(s) || agg.cov[i] < SOLID) { flush(); continue; }
      up.push(`${x(P.t[i]).toFixed(1)} ${y(Math.min(hi, m + s)).toFixed(1)}`);
      dn.push(`${x(P.t[i]).toFixed(1)} ${y(Math.max(lo, m - s)).toFixed(1)}`);
    }
    flush();
    return segs.join(" ");
  }
  // Round tick values, not range/n: an axis reading 0.475 / 0.391 / 0.307 is a
  // number the reader has to decode before they can use it.
  function ticks(a, b, n) {
    const raw = (b - a) / Math.max(1, n);
    if (!(raw > 0)) return [a];
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((v) => v >= raw) || 10 * mag;
    const out = [];
    for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-9; v += step) out.push(Math.round(v / step) * step);
    return out;
  }
  // The click axis carries a tick mark every 25 clicks, each labelled (#4635),
  // rather than ticks()' 50 / 100 on a 150-click run.  Where 25 clicks are too
  // narrow to label, the labels thin to every 50, 100, ... and the marks stay
  // at every 25.  The horizon gets a label of its own when it is off the step
  // and clear of the last one, since it is where every line ends.
  const XSTEP = 25, XLABEL_PX = 34;
  function clickTicks(tmax, width) {
    const marks = [];
    for (let t = 0; t <= tmax; t += XSTEP) marks.push(t);
    const px = (dt) => (dt / Math.max(1, tmax)) * width;
    const every = [1, 2, 4, 10, 20, 40, 100, 200, 400].find((k) => px(k * XSTEP) >= XLABEL_PX) || 1000;
    const labels = marks.filter((t) => t % (every * XSTEP) === 0);
    const last = labels[labels.length - 1];
    if (tmax !== last && px(tmax - last) >= XLABEL_PX * 0.75) labels.push(tmax);
    return { marks, labels };
  }
  const trim = (v) => {
    const a = Math.abs(v);
    if (a >= 100 || v === 0) return v.toFixed(0);
    return a >= 1 ? String(+v.toFixed(2)) : String(+v.toFixed(4));
  };

  // ---- hover: crosshair + tooltip ----------------------------------------
  function hover(el, pnl, spec, x, y, opt) {
    const showCov = opt.showCov;
    const svg = el.querySelector("svg");
    const tip = document.createElement("div");
    tip.className = "tip";
    el.appendChild(tip);
    const cross = document.createElementNS("http://www.w3.org/2000/svg", "line");
    cross.setAttribute("stroke", "var(--axis)");
    cross.setAttribute("stroke-width", "1");
    cross.setAttribute("y1", M.t); cross.setAttribute("y2", H - M.b);
    cross.style.opacity = "0";
    svg.appendChild(cross);
    const tmax = P.t[nT - 1];

    svg.addEventListener("pointermove", (ev) => {
      const r = svg.getBoundingClientRect();
      const vx = ((ev.clientX - r.left) / r.width) * W;
      if (vx < M.l || vx > W - M.r) return hide();
      if (opt.stopView) return stopTip(ev, r);
      const t = Math.round(((vx - M.l) / (W - M.l - M.r)) * tmax);
      let i = P.t.indexOf(Math.max(P.t[0], Math.min(tmax, t)));
      if (i < 0) i = 0;
      cross.setAttribute("x1", x(P.t[i])); cross.setAttribute("x2", x(P.t[i]));
      cross.style.opacity = "1";
      const rows = pnl.per.map((q) =>
        `<tr><td class="k"><span class="sw" style="background:${q.color}"></span>${esc(q.name)}</td>` +
        `<td class="v">${fmt(q.agg.mean[i])}</td>` +
        (opt.showOracle ? `<td class="v" style="color:var(--ink-2);padding-left:10px">${fmt(q.agg.omean[i])}</td>` : "") +
        (opt.showSky ? `<td class="v" style="color:var(--ink-2);padding-left:10px">${fmt(q.sky)}</td>` : "") +
        (showCov ? `<td class="v" style="color:var(--muted);padding-left:10px">${(q.agg.cov[i] * 100).toFixed(0)}%</td>` : "") +
        `</tr>`).join("");
      const cols = ["value"]
        .concat(opt.showOracle ? [ONAME] : [], opt.showSky ? ["skyline"] : [], showCov ? ["% measured"] : []);
      tip.innerHTML =
        `<div class="hd">${P.t[i]} click${P.t[i] === 1 ? "" : "s"}${P.t[i] === 0 && P.anchor.has ? " — " + esc(P.anchor.label) : ""}</div>` +
        `<table>${rows}</table>` +
        `<div style="color:var(--muted);margin-top:4px">${esc(spec.label)} · ${cols.join(" · ")}</div>`;
      tip.style.opacity = "1";
      tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.max(4, ev.clientY - r.top - 10) + "px";
    });
    svg.addEventListener("pointerleave", hide);
    function hide() { tip.style.opacity = "0"; cross.style.opacity = "0"; }
    // Where the app said stop there is no click to read across, so the tip
    // says what the series' marks add up to, wherever the pointer is.
    function stopTip(ev, r) {
      const rows = pnl.per.map((q) => {
        const s = q.stop;
        return `<tr><td class="k"><span class="sw" style="background:${q.color}"></span>${esc(q.name)}</td>` +
          `<td class="v">${s.fired}/${s.runs}</td>` +
          `<td class="v" style="padding-left:10px">${Number.isFinite(s.tMedian) ? s.tMedian : "—"}</td>` +
          `<td class="v" style="padding-left:10px">${fmt(s.mean)} ± ${fmt(s.sd)}</td>` +
          `<td class="v" style="color:var(--ink-2);padding-left:10px">${fmt(s.neverMean)}</td></tr>`;
      }).join("");
      tip.innerHTML =
        `<div class="hd">Where the app said stop</div><table>${rows}</table>` +
        `<div style="color:var(--muted);margin-top:4px">told to stop · median click · ${esc(spec.label)} there, ` +
        `mean ± SD · never told: at its last click</div>`;
      tip.style.opacity = "1";
      tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.max(4, ev.clientY - r.top - 10) + "px";
    }
  }

  // ---- prose + table ------------------------------------------------------
  function reading(spec, pl, hidden, wanted, opt) {
    const bits = [];
    if (opt.stopView) bits.push(stopReading(spec));
    else bits.push(
      `<b>Reading it.</b> Each line is the ${state.seedMode === "each" ? "individual run" : "mean over the cells it pools"}; ` +
      (opt.useOverlay
        ? `the shaded spread is dropped in this view — several translucent bands over one another are a shape nobody can read, so overlay trades the spread for the comparison. Untick it to get one chart per series with its band back.`
        : `the shaded band is ±1 SD.`) +
      ` A line is <b>dashed</b> wherever fewer than ${(SOLID * 100).toFixed(0)}% of that ` +
      `series' cells are measured at that click — there it describes a subset, not the grid, so only a solid ` +
      `segment is a level worth quoting.` +
      (P.gaps_filled
        ? ` A run inside a spot check is scored once per round of picks, and between rounds its last scored ` +
          `value stands in, so a check never drops a run from the mean (#4624).`
        : "") +
      (P.empty_sets_scored
        ? ` A click where a run has <b>no detector</b> yet (before its first Good, or at every click of a run ` +
          `that never got one) counts as what the app returns there, nothing: recall, F1 and the ` +
          `objective 0, precision 0, AP at the class's prevalence, AUROC 0.5. A detector that flags nothing ` +
          `returns the same empty set, so its precision counts as 0 too. So every run is in the mean at every ` +
          `click, the failing ones included. From its first Good on, a run is drawn at the detector its labels ` +
          `give, which is what Test or an import of the exported labels gives at that click: <b>the Goods' ` +
          `centroid</b> until the labels hold 3 Goods and 4 Bads (or a Good and 16 Bads, #4731), the trained detector from there (#4643), ` +
          `<b>through Autopilot's opening too</b>, where the session itself still shows the text sort (#4640). ` +
          `A dip below the notch there is what exporting would get, not what the session shows. Results run ` +
          `before #4643 start at the first Good and Bad, with a trained detector from there, as the app did.`
        : "") +
      (opt.showCov
        ? ` The strip underneath is that fraction, and it drops below full somewhere in this slice.`
        : ` <b>Every cell is measured at every click here</b>, so the coverage strip is omitted rather than drawn` +
          ` as a flat 100% line: nothing in this slice dropped out.`));
    if (P.anchor.has) bits.push(
      `<b>The notch in the left margin is the ${esc(P.anchor.label)}</b> — what typing the query got for free. ` +
      (opt.stopView
        ? `A stop is worth its clicks once it has crossed that notch.`
        : `Nothing joins it to the curve on purpose: nothing was measured between it and the first scored click, so ` +
          `the gap is the honest drawing. A curve is worth its clicks once it has crossed that notch.`));
    if (opt.showSky) bits.push(
      `<b>The notch in the right margin is the ${esc(P.skyline.label)}</b> — the same head, through the same ` +
      `trainer, with every training label handed to it (issue #3322). It is vote-independent, which is why it is a ` +
      `mark at the horizon and not a rule across the chart: it is the floor this loop is walking toward, not a level ` +
      `it reached early. The distance still left to it is what better <b>acquisition</b> could buy; the floor itself ` +
      `is what only a better <b>embedder</b> can move.`);
    if (opt.showOracle && OBEST) bits.push(
      `<b>The dotted line is the best cut</b> — the same model's ranking, cut with the test labels in hand. ` +
      (FMETRICS.has(spec.key)
        ? `On ${esc(spec.label)} it is the best ${esc(spec.label)} any cut reaches, so it never sits below the solid ` +
          `line, and the gap between them is what the line left on the table: quality the ranking already had and ` +
          `the threshold rule gave away. The solid line over the dotted one is the line's <b>share of the best cut</b>.`
        : spec.key === "cost"
          ? `On cost it is the cost-minimising cut, the objective before F-beta.`
          : `On ${esc(spec.label)} it is that cut's own: the cut the run's objective would have drawn (the best ` +
            `F-beta at its balance${COST_RETIRED ? "" : "; with no balance, the lowest cost"}), reconstructed exactly ` +
            `from its FPR/FNR and the split's class counts. It can sit on either side of the solid line, and says ` +
            `which way the line missed.`) +
      (P.anchor.has ? ` Its dotted notch in the left margin is the text sort's own best cut.` : ""));
    else if (opt.showOracle) bits.push(
      `<b>The dotted line is the cost-optimal cut</b> — the same model's scores, cut where the test labels put the ` +
      `lowest weighted FPR + FNR, the objective before F-beta. On cost, the gap between it and the solid line is the ` +
      `<b>calibration regret</b>.` +
      (spec.key === "cost" ? "" : ` It is no ceiling on ${esc(spec.label)}: the cost prices the two error rates, so ` +
        `on a rare class it cuts deep, and its ${esc(spec.label)} can sit below the solid line (#4654). It is ` +
        `reconstructed exactly from the cut's own FPR/FNR and the split's class counts.`));
    else if (spec.ranking && HAS_ORACLE && !opt.stopView) bits.push(
      `<b>${esc(spec.label)} has no oracle line.</b> It integrates over every threshold, so moving the cut cannot ` +
      `move it — the oracle and the performance line would be the same line drawn twice.`);
    // The stopped points' share told to stop is in each chart's heading, for
    // the slice on screen, so the page-wide note is not repeated here.
    if (state.seedMode === "each" && !opt.stopView && P.runs_note) bits.push(esc(P.runs_note));
    if (opt.useOverlay && state.embedders.size > 1) bits.push(
      `<b>Overlaying embedders is not averaging them.</b> Two embedders are two representations of the haystack and ` +
      `their mean describes no system anyone could run — but two lines pool nothing, so the comparison is fair.`);
    if (hidden) bits.push(
      `<b>${hidden} of ${wanted} charts are not drawn</b> (the page caps at ${MAX_PANELS}). Narrow the selection, ` +
      `or tick <b>overlay on one chart</b> to put them all on one.`);
    $("reading").innerHTML = bits.join(" ");
  }

  // Where the app said stop (#4939): what each series' dots add up to.
  function stopReading(spec) {
    const m = esc(spec.label);
    return `<b>Reading it.</b> ` +
      (state.seedMode === "each"
        ? `Each dot is one run, at the click where the app first said stop and at the run's ${m} there: the value ` +
          `its whole curve has at that click. A run the app never told to stop is a <b>hollow dot at its last ` +
          `click</b>, so every attempted run is on the chart` +
          (P.empty_sets_scored ? `, the ones that never trained included, as the empty set they returned` : "") +
          `. Dots are spread by up to a third of a click so that runs which stopped at the same click do not hide ` +
          `one another. `
        : `Each series is one marker; pick <b>each its own dot</b> for the runs behind it. `) +
      `The app said stop the first time Autopilot reached Done and told the user they could stop. It says so once, ` +
      `and the session clicks on to its budget either way. <b>The large dot is the series' median stop</b> ` +
      `(Kaplan–Meier, carrying the runs never told to stop as censored at their last click) at the mean ${m} at ` +
      `the stop over the runs that stopped, with a ±1 SD bar. There is none where fewer than half the runs ` +
      `stopped, since the median is then unknown. Read the share told to stop, in each chart's heading, first: ` +
      `everything about the runs that stopped is conditional on it.`;
  }

  function stopTable(spec, panels, opt) {
    const pl = plan();
    const m = esc(spec.label);
    let html = "";
    for (const p of panels) {
      html += `<table class="data"><caption style="text-align:left;color:var(--muted);padding:8px 0 2px">${esc(panelTitle(p.fk, pl))}</caption>` +
        `<thead><tr><th>series</th><th>runs</th><th>told to stop</th><th>median stop</th><th>${m} at stop</th>` +
        `<th>SD</th><th>never told: ${m} at last click</th>` +
        (opt.showSky ? `<th>skyline</th>` : "") + `</tr></thead><tbody>`;
      for (const q of p.per) {
        const s = q.stop;
        html += `<tr><td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:${q.color}"></span>${esc(q.name)}${q.sel.arm && q.name !== q.sel.arm ? " · " + esc(q.sel.arm) : ""}</td>` +
          `<td>${s.runs}</td><td>${s.fired} (${s.runs ? ((100 * s.fired) / s.runs).toFixed(0) : 0}%)</td>` +
          `<td>${Number.isFinite(s.tMedian) ? s.tMedian : "—"}</td><td>${fmt(s.mean)}</td><td>${fmt(s.sd)}</td>` +
          `<td>${fmt(s.neverMean)}</td>` + (opt.showSky ? `<td>${fmt(q.sky)}</td>` : "") + `</tr>`;
      }
      html += `</tbody></table>`;
    }
    $("table").innerHTML = html + `<p class="note">Where the app said stop, for the current selection. The median ` +
      `stop is Kaplan–Meier, the runs never told to stop censored at their last click; ${m} at the stop and its SD ` +
      `are over the runs told to stop.</p>`;
  }

  function tableView(spec, panels, opt) {
    const marks = [0, 10, 20, 50, 100, P.t[nT - 1]].filter((t, i, a) => P.t.includes(t) && a.indexOf(t) === i);
    const pl = plan();
    let html = "";
    for (const p of panels) {
      html += `<table class="data"><caption style="text-align:left;color:var(--muted);padding:8px 0 2px">${esc(panelTitle(p.fk, pl))}</caption>` +
        `<thead><tr><th>series</th>` + marks.map((t) => `<th>${t === 0 && P.anchor.has ? "text" : t}</th>`).join("") +
        (opt.showSky ? `<th>skyline</th>` : "") + `</tr></thead><tbody>`;
      for (const q of p.per) {
        html += `<tr><td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:${q.color}"></span>${esc(q.name)}${q.sel.arm && q.name !== q.sel.arm ? " · " + esc(q.sel.arm) : ""}</td>` +
          marks.map((t) => `<td>${fmt(q.agg.mean[P.t.indexOf(t)])}</td>`).join("") +
          (opt.showSky ? `<td>${fmt(q.sky)}</td>` : "") + `</tr>`;
        if (opt.showOracle) html +=
          `<tr style="color:var(--muted)"><td style="padding-left:21px">↳ ${ONAME}</td>` +
          marks.map((t) => `<td>${fmt(q.agg.omean[P.t.indexOf(t)])}</td>`).join("") +
          (opt.showSky ? `<td>—</td>` : "") + `</tr>`;
      }
      html += `</tbody></table>`;
    }
    $("table").innerHTML = html + `<p class="note">${esc(spec.label)} at the click marks above, for the current selection.` +
      (P.anchor.has ? ` The <b>text</b> column is click 0, the free text sort.` : "") + `</p>`;
  }

  render();
})();
</script>
</body>
</html>
