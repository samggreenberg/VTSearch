[project]
name = "vtsearch"
version = "0.1.0"
requires-python = ">=3.10"
description = "Media explorer for browsing and voting on audio, images, text, video, or documents"

# Core dependencies — enough to start the Flask app and serve the UI.
# Media-type packages (audio, video, image, text, document) are optional;
# models load lazily so missing packages only error when that media type
# is actually used.
dependencies = [
    "flask",
    "numpy<2",
    "requests",
    "tqdm",
    "scikit-learn",
    "transformers",
    "pandas",
]

[project.optional-dependencies]
# ── Media types (install only what you need) ──────────────────────────
audio = ["librosa", "soundfile"]
video = ["opencv-python-headless<4.10"]
image = ["Pillow", "ultralytics"]
text  = ["sentence-transformers"]
document = ["PyMuPDF"]
all-media = [
    "vtsearch[audio]",
    "vtsearch[video]",
    "vtsearch[image]",
    "vtsearch[text]",
    "vtsearch[document]",
]

# ── Importers / exporters with extra deps ─────────────────────────────
email = ["dnspython>=2.0.0"]

# ── Eval / visualization ──────────────────────────────────────────────
eval = ["matplotlib", "scipy"]

# ── PyTorch: pick ONE of cpu / gpu ────────────────────────────────────
cpu = ["torch>=2.0.0", "vtsearch[all-media]", "vtsearch[email]", "vtsearch[eval]"]
gpu = ["torch>=2.0.0", "vtsearch[all-media]", "vtsearch[email]", "vtsearch[eval]"]

# ── Development ───────────────────────────────────────────────────────
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["vtsearch*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E402: Module level import not at top of file
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA GPU (deselected by default, run with: -m gpu)",
    "slow: CLI subprocess tests that spawn a fresh Python process (~16s each)",
    "core: basic app functionality (audio, medias, votes, inclusion, settings, frontend)",
    "api: API contracts, error handling, dashboard",
    "sorting: text sort, learned sort, diversity, safe thresholds",
    "datasets: dataset loading, splitting, combining, origins, dedup",
    "io: importers, exporters, labels, processors",
    "models: detectors, extractors, processors, clippers, eval",
    "downloads: demo dataset download tests (network-dependent)",
    "integration: end-to-end workflows, thread safety",
    "cli: CLI autodetect, load sort window, progress",
    "converters: document and media converters",
]
addopts = "-m 'not gpu and not slow'"
